# Baseline applied to every governed repo. Layers merge on top of this:
#   defaults -> visibility/<public|private> -> profiles/<profile> -> repos.yaml config
# Objects deep-merge; arrays are replaced; a key set to null removes it.
# Keys not mentioned anywhere are never touched on the target repo.

# PATCH repos/{repo}
settings:
  allow_auto_merge: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_update_branch: false
  delete_branch_on_merge: true
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES
  has_issues: true
  has_projects: true
  has_wiki: false
  has_discussions: false

# vulnerability-alerts and automated-security-fixes endpoints
security:
  vulnerability_alerts: true
  automated_security_fixes: true

# PUT repos/{repo}/actions/permissions/workflow
# can_approve_pull_request_reviews=false makes the shared review workflow fail
# with an HTTP 422 that looks like a content failure.
workflow_permissions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: true

# Labels, keyed by name. Missing ones are created, colour/description drift is
# fixed. Nothing is deleted unless listed in labels_prune.
labels:
  bug: {color: "d73a4a", description: Something isn't working}
  documentation: {color: "0075ca", description: Improvements or additions to documentation}
  duplicate: {color: "cfd3d7", description: This issue or pull request already exists}
  enhancement: {color: "a2eeef", description: New feature or request}
  good first issue: {color: "7057ff", description: Good for newcomers}
  help wanted: {color: "008672", description: Extra attention is needed}
  invalid: {color: "e4e669", description: This doesn't seem right}
  question: {color: "d876e3", description: Further information is requested}
  wontfix: {color: "ffffff", description: This will not be worked on}
  automated: {color: "ededed"}
  automated-review: {color: "ededed"}
  ci/ready: {color: "0e8a16"}
  dependencies: {color: "ededed"}
  DRY: {color: "ededed"}
  github-actions: {color: "4d1911"}
  lint: {color: "338be7"}
  refactoring: {color: "ededed"}
  release:major: {color: "0e8a16"}
  release:minor: {color: "0e8a16"}
  release:none: {color: "e4e669"}
  release:patch: {color: "0e8a16"}
  security: {color: "ededed"}
  technical-debt: {color: "ededed"}
labels_prune: []

# Ruleset on the default branch. Required checks are a map so that layers can
# add (or null out) single checks. An empty value means "any source"; use
# integration_id 15368 to pin a check to GitHub Actions.
# requires_file: the check is only enforced once that file exists on main,
# otherwise every PR would wait forever for a check that never reports.
ruleset:
  name: main
  target: branch
  enforcement: active
  include: [refs/heads/main]
  exclude: []
  deletion: true
  non_fast_forward: true
  pull_request:
    required_approving_review_count: 0
    dismiss_stale_reviews_on_push: false
    require_code_owner_review: false
    require_last_push_approval: false
    required_review_thread_resolution: true
    require_extra_approval_for_unattributed_changes: true
    allowed_merge_methods: [squash]
  required_status_checks:
    strict: true
    do_not_enforce_on_create: false
    checks:
      "pre-commit / pre-commit": {integration_id: 15368}
      "ci-cd / Run Test Suite": {integration_id: 15368}
      "review / AI Code Review": {integration_id: 15368}
      "Release Label Check / Release Label Check": {integration_id: 15368}
      "secret-scan / Gitleaks": {requires_file: .github/workflows/secret-scan.yml}
  copilot_code_review:
    review_on_push: false
    review_draft_pull_requests: false
