---
required: true
exempt_patterns:
  - "**/*.md"
  - ".gitignore"
  - "LICENSE"
  - "CLAUDE.md"
  - ".yamllint"
  - ".markdownlint.json"
  - ".editorconfig"
  - ".commitlintrc.json"
  - ".pre-commit-config.yaml"
  - ".github/ISSUE_TEMPLATE/**"
  - ".github/PULL_REQUEST_TEMPLATE.md"
  - ".github/CODEOWNERS"
  - ".github/dependabot.yml"
  - ".github/label-check.yml"
  - ".github/actionlint.yml"
  # Deliberately NOT exempting .github/workflows/** here, unlike every
  # consumer repo's label-check.yml: those files are meta-CI config in
  # consumer repos, but they're this repo's actual shipped product — a
  # release label is exactly what should gate changes to them.
