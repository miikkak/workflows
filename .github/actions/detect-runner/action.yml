---
name: Detect runner
description: >-
  Pick the runner labels for a workflow's jobs, routing pull requests from
  forks off self-hosted infrastructure. Shared by pr-check, ci-cd,
  code-review and secret-scan so the trust rule lives in one place.

inputs:
  default-runner:
    description: Runner labels as a JSON array string, used for trusted events.
    required: true
  default-test-runner:
    description: >-
      Runner labels as a JSON array string for the test job, used for trusted
      events. Empty if the caller has no separate test runner. For a fork PR it
      is kept as-is only when every label is a GitHub-hosted runner name
      (e.g. windows-latest); otherwise the fork gets ubuntu-slim.
    required: false
    default: ""
  docker-buildx:
    description: >-
      "true" if the test job builds containers. An untrusted fork then gets
      ubuntu-latest for the test runner, since ubuntu-slim can't do container
      builds.
    required: false
    default: "false"

outputs:
  runner:
    description: Runner labels as a JSON array string.
    value: ${{ steps.pick.outputs.runner }}
  test-runner:
    description: >-
      Test-job runner labels as a JSON array string (empty if no
      default-test-runner was given and the run is trusted).
    value: ${{ steps.pick.outputs.test-runner }}

runs:
  using: composite
  steps:
    - name: Pick runner
      id: pick
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
        DEFAULT_RUNNER: ${{ inputs.default-runner }}
        DEFAULT_TEST_RUNNER: ${{ inputs.default-test-runner }}
        DOCKER_BUILDX: ${{ inputs.docker-buildx }}
      run: |
        set -Eeuo pipefail
        # Untrusted only when the PR comes from an actual fork (not a
        # branch pushed directly into this repo by us, Renovate, or
        # Dependabot) - route those to an ephemeral GitHub-hosted runner so
        # arbitrary PR-controlled code never touches self-hosted
        # infrastructure. Non-pull_request events (push, release,
        # schedule) are always trusted since only someone with write
        # access triggers them. Deliberately not gated on repo visibility:
        # a currently-private repo can still gain an external collaborator
        # with read access later, who could then fork and PR - fork-origin
        # alone is the correct, durable signal.
        untrusted_fork=false
        if [[ "${EVENT_NAME}" == "pull_request" && "${HEAD_REPO}" != "${BASE_REPO}" ]]; then
          untrusted_fork=true
        fi
        if [[ "${untrusted_fork}" == "true" ]]; then
          echo 'runner=["ubuntu-slim"]' >> "$GITHUB_OUTPUT"
          # A caller whose test job needs a specific GitHub-hosted OS (e.g.
          # windows-latest for a WinForms target) keeps it: those runners are
          # ephemeral and hold no self-hosted infrastructure, so they are as
          # safe for a fork as ubuntu-slim. Only keep it when every label is
          # GitHub-hosted - one self-hosted label (or a custom one) and the
          # override below still applies.
          github_hosted=false
          has_slim=false
          hosted_json=""
          # Strip all whitespace (incl. newlines from a block-scalar input),
          # then split the JSON array into its labels.
          compact="$(printf '%s' "${DEFAULT_TEST_RUNNER}" | tr -d '[:space:]')"
          IFS=',' read -r -a labels <<< "${compact//[\[\]\"]/}"
          if ((${#labels[@]} > 0)); then
            github_hosted=true
            for label in "${labels[@]}"; do
              hosted_json+="${hosted_json:+,}\"${label}\""
              # Explicit allowlist of GitHub-hosted names, not a pattern, so a
              # self-hosted runner that merely carries a similar label (e.g.
              # ubuntu-selfhosted, ubuntu-24, macos-99-large) still gets
              # overridden. An unlisted new hosted label fails safe to
              # ubuntu-slim until it is added here.
              case "${label}" in
                ubuntu-slim) has_slim=true ;;
                ubuntu-latest | ubuntu-22.04 | ubuntu-24.04 | ubuntu-22.04-arm | ubuntu-24.04-arm) ;;
                windows-latest | windows-2022 | windows-2025 | windows-2025-vs2026 | windows-11-arm) ;;
                macos-latest | macos-latest-large | macos-latest-xlarge) ;;
                macos-14 | macos-14-large | macos-14-xlarge) ;;
                macos-15 | macos-15-intel | macos-15-large | macos-15-xlarge) ;;
                macos-26 | macos-26-intel | macos-26-large | macos-26-xlarge) ;;
                *) github_hosted=false ;;
              esac
            done
          fi
          # ubuntu-slim can't do container builds - an untrusted fork's
          # docker-buildx test job needs the full ubuntu-latest image, not
          # the ephemeral-but-incapable slim one, even if the caller asked
          # for slim.
          if [[ "${github_hosted}" == "true" && "${DOCKER_BUILDX}" == "true" && "${has_slim}" == "true" ]]; then
            echo 'test-runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          elif [[ "${github_hosted}" == "true" ]]; then
            # Rebuilt from the validated labels, so the output is compact
            # single-line JSON whatever shape the input had.
            echo "test-runner=[${hosted_json}]" >> "$GITHUB_OUTPUT"
          elif [[ "${DOCKER_BUILDX}" == "true" ]]; then
            echo 'test-runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'test-runner=["ubuntu-slim"]' >> "$GITHUB_OUTPUT"
          fi
        else
          echo "runner=${DEFAULT_RUNNER}" >> "$GITHUB_OUTPUT"
          echo "test-runner=${DEFAULT_TEST_RUNNER}" >> "$GITHUB_OUTPUT"
        fi
