---
name: Post-Merge Pipeline

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'
      test-runner:
        description: >-
          Runner for the test job specifically, as a JSON array or JSON string
          (e.g. '["self-hosted","linux","generic"]' or '"ubuntu-latest"').
          Defaults to the same value as `runner`; override for jobs that need
          a github-hosted runner (e.g. Docker Buildx amd64 builds).
        type: string
        default: '["self-hosted","linux","generic"]'
      code-paths:
        description: >-
          Full contents of the paths-filter "code" list, as comma-separated
          quoted globs (e.g. "'**/*.go', 'go.mod', 'go.sum'"). Repos whose
          code isn't shell/Python (Go, Dockerfiles, DNS zone files, etc.)
          pass their own complete list here instead of appending to it.
        type: string
        default: >-
          '**/*.sh', '**/*.bash', '**/*.py', '.github/workflows/**',
          '.pre-commit-config.yaml', 'package*.json', '.releaserc.json'
      language-setup:
        description: 'Language toolchain to install in the test job: none, go, or uv'
        type: string
        default: none
      test-timeout-minutes:
        description: Timeout (minutes) for the test job
        type: number
        default: 15
      docker-buildx:
        description: Set up Docker Buildx before running tests (container repos)
        type: boolean
        default: false
    secrets:
      SEMANTIC_RELEASE_TOKEN:
        description: >-
          PAT used to check out and push for semantic-release. Required:
          GITHUB_TOKEN cannot push tags in a way that triggers downstream
          tag-based workflows (release.yml).
        required: true
      PULL_REQUEST_TOKEN:
        description: >-
          Token used as GH_TOKEN for the docker-buildx test path. Only
          required when docker-buildx is true; harmless if omitted otherwise.
        required: false

permissions:
  contents: read

# ==============================================================================
# SHARED WORKFLOW - cd.yml
# ==============================================================================
# 3-phase CI/CD architecture, phase 2 (post-merge). Consumers trigger this via
# their own .github/workflows/cd.yml wrapper, which owns the `on: push`
# trigger and the concurrency group, and may append repo-specific jobs after
# this call (e.g. config deploy webhooks, alert provisioning) keyed off
# `needs.cd.result`.
#
# Phase 1: PR Validation (ci-cd.yml)       → pull_request trigger
# Phase 2: Post-Merge Pipeline (this file) → push to main trigger
# Phase 3: Release & Deploy (release.yml)  → tag push trigger
#
# Core jobs: detect-changes, check-trigger, test, semantic-release
#
# Release flow: label-gated semantic-release creates tag → tag push
# triggers release.yml → artifact/image build → release created
# ==============================================================================

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code: [ ${{ inputs.code-paths }} ]
            docs:
              - '**/*.md'
              - '.gitignore'
              - 'LICENSE'
              - 'CLAUDE.md'
              - '.yamllint'
              - '.markdownlint.json'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'

  check-trigger:
    name: Check Merge Trigger
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.result == 'success'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      skip_code_checks: ${{ steps.check.outputs.skip_code_checks }}
    steps:
      - name: Check trigger conditions
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "✅ Running full pipeline (manual trigger)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_code_checks=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODE_CHANGES="${{ needs.detect-changes.outputs.code }}"
          if [[ "$CODE_CHANGES" == "true" ]]; then
            echo "✅ Running full pipeline (code changes detected)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_code_checks=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Running pipeline (docs-only changes, skipping code checks)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_code_checks=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Test Suite
    runs-on: ${{ fromJson(inputs.test-runner) }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true' && needs.check-trigger.outputs.skip_code_checks == 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        if: inputs.language-setup == 'go' && runner.environment == 'github-hosted'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up uv
        if: inputs.language-setup == 'uv' && runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Docker Buildx
        if: inputs.docker-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Run repository tests
        env:
          GH_TOKEN: ${{ inputs.docker-buildx && secrets.PULL_REQUEST_TOKEN || '' }}
        run: |
          if [[ -f .github/scripts/run-tests.sh ]]; then
            bash .github/scripts/run-tests.sh
          else
            echo "ℹ️  No test script found (0/0 tests) — OK"
          fi

  semantic-release:
    name: Publish Release
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 10
    needs: [check-trigger, test]
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Allow running even if test was skipped (docs-only changes)
    if: |
      always() &&
      needs.check-trigger.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # PAT required: GITHUB_TOKEN cannot push tags in a way that
          # triggers downstream tag-based workflows (release.yml).
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Check for release label
        id: check_label
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          # Get the PR number associated with this commit via the GitHub API
          GH_API_OUTPUT=$(
            gh api "/repos/${GH_REPO}/commits/${GH_SHA}/pulls" \
              --jq '.[0].number // empty' 2>&1
          ) || {
            echo "⚠️  GitHub API call failed - skipping release"
            echo "    Error: $GH_API_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          PR_NUMBER="$GH_API_OUTPUT"

          if [[ -z "$PR_NUMBER" ]]; then
            echo "ℹ️  Not a PR merge commit, skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get PR labels
          GH_VIEW_OUTPUT=$(
            gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>&1
          ) || {
            echo "⚠️  GitHub API call failed reading PR labels - skipping release"
            echo "    Error: $GH_VIEW_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          LABELS="$GH_VIEW_OUTPUT"

          # Check for release:* labels and determine release type
          # Priority: major > minor > patch (highest wins if multiple labels)
          RELEASE_TYPE=""
          for candidate in major minor patch; do
            if echo "$LABELS" | grep -qxF "release:${candidate}"; then
              RELEASE_TYPE="$candidate"
              break
            fi
          done

          if [[ -n "$RELEASE_TYPE" ]]; then
            echo "✅ Release label resolved to release:${RELEASE_TYPE} - proceeding with semantic-release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qxF "release:none"; then
            echo "ℹ️  release:none label detected — deployment intentionally skipped"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️  No release label found - skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: runner.environment == 'github-hosted' && (steps.check_label.outputs.should_release == 'true')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.check_label.outputs.should_release == 'true'
        run: npm ci

      - name: Run semantic-release
        if: steps.check_label.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          RELEASE_TYPE: ${{ steps.check_label.outputs.release_type }}
        run: npx semantic-release
