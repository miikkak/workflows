---
# Server-side secret scanning with gitleaks. Backstop for the local pre-commit
# hook, which `git commit --no-verify` skips (and which scans only *staged*
# changes, so it is a no-op in CI). One workflow covers three layers, chosen
# by the triggering event:
#
#   pull_request / push -> scan only the commits the event introduced
#                          (fast; PR run is the merge-blocking layer, push run
#                          catches direct pushes and PR-less branches within
#                          minutes)
#   schedule / dispatch -> scan the full history of every ref (last line of
#                          defence for anything that predates the gate)
#
# Findings on PRs fail the job (make it a required status check). Findings on
# push/schedule fail the job AND open/update a `security` issue. Findings are
# always redacted; treat any hit as a leaked credential — rotate first.
#
# Deliberately a single self-contained workflow: no nested reusable-workflow
# calls back into this repo (see self-verify-toolchains.yml for why).
name: Secret Scan

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  schedule:
    # Run daily at 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'

# Never cancel: a push run only covers before..after, so cancelling run A
# because push B arrived would leave A's commits unscanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-runner:
    name: Detect Runner
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick runner
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          DEFAULT_RUNNER: ${{ inputs.runner || '["self-hosted","linux","generic"]' }}
        run: |
          set -Eeuo pipefail
          # Same rule as pr-check.yml: fork-origin PRs never touch
          # self-hosted infrastructure. Every other event is trusted.
          if [[ "${EVENT_NAME}" == "pull_request" && "${HEAD_REPO}" != "${BASE_REPO}" ]]; then
            echo 'runner=["ubuntu-slim"]' >> "$GITHUB_OUTPUT"
          else
            echo "runner=${DEFAULT_RUNNER}" >> "$GITHUB_OUTPUT"
          fi

  gitleaks:
    name: Gitleaks
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GITLEAKS_VERSION: "v8.30.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -Eeuo pipefail
          case "$(uname -m)" in
            x86_64)  arch="x64" ;;
            aarch64) arch="arm64" ;;
            *)       echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          version="${GITLEAKS_VERSION#v}"
          archive="gitleaks_${version}_linux_${arch}.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${bin_dir}"
          curl -fsSL --retry 3 --retry-delay 5 "${base}/${archive}" -o "${bin_dir}/${archive}"
          curl -fsSL --retry 3 --retry-delay 5 "${base}/gitleaks_${version}_checksums.txt" \
            -o "${bin_dir}/checksums.txt"
          # Verify the archive against the release's published checksums
          # before extracting anything.
          (cd "${bin_dir}" && grep -F "  ${archive}" checksums.txt | sha256sum -c -)
          tar -xzf "${bin_dir}/${archive}" -C "${bin_dir}" gitleaks
          echo "${bin_dir}" >> "$GITHUB_PATH"

      - name: Determine scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          zero="0000000000000000000000000000000000000000"
          skip=false
          case "${EVENT_NAME}" in
            pull_request)
              log_opts="${PR_BASE}..${PR_HEAD}"
              ;;
            push)
              if [[ "${PUSH_AFTER}" == "${zero}" ]]; then
                # Branch deletion: nothing new to scan.
                skip=true
                log_opts=""
              else
                base="${PUSH_BEFORE}"
                if [[ "${base}" == "${zero}" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                  # New branch, or a force-push that orphaned the old tip:
                  # scan everything not already on the default branch.
                  base=""
                  if [[ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]] \
                    && git rev-parse --verify --quiet "origin/${DEFAULT_BRANCH}" > /dev/null; then
                    base="$(git merge-base "origin/${DEFAULT_BRANCH}" "${PUSH_AFTER}")"
                  fi
                fi
                if [[ -n "${base}" ]]; then
                  log_opts="${base}..${PUSH_AFTER}"
                else
                  log_opts="${PUSH_AFTER}"
                fi
              fi
              ;;
            *)
              # schedule / workflow_dispatch: every commit on every ref.
              log_opts="--full-history --all"
              ;;
          esac
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "log_opts=${log_opts}" >> "$GITHUB_OUTPUT"
          echo "Scan range (${EVENT_NAME}): ${log_opts:-<skipped>}"

      - name: Scan for secrets
        id: scan
        if: steps.range.outputs.skip != 'true'
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -Eeuo pipefail
          gitleaks version
          # gitleaks exits 0 ("no leaks found") when git rejects the revision
          # range, so validate the range ourselves — fail closed, never open.
          # LOG_OPTS is deliberately word-split (e.g. "--full-history --all").
          # shellcheck disable=SC2086
          git rev-list ${LOG_OPTS} > /dev/null

          # Exit code 2 = leaks found; anything else non-zero is a real
          # error (bad config, git failure) and must fail the job as such.
          rc=0
          gitleaks git . \
            --log-opts="${LOG_OPTS}" \
            --redact --no-banner --no-color --verbose \
            --exit-code 2 \
            --report-format json --report-path "${RUNNER_TEMP}/gitleaks-report.json" \
            2>&1 | tee "${RUNNER_TEMP}/gitleaks.log" || rc=${PIPESTATUS[0]}
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          if [[ "${rc}" -ne 0 && "${rc}" -ne 2 ]]; then
            echo "::error::gitleaks failed with exit code ${rc}"
            exit "${rc}"
          fi
          # Belt and braces: gitleaks logs ERR for internal git failures yet
          # can still exit 0, which would read as a clean scan.
          if grep -qE '(^|[[:space:]])ERR([[:space:]]|$)' "${RUNNER_TEMP}/gitleaks.log"; then
            echo "::error::gitleaks logged errors; refusing to treat the scan as clean"
            exit 1
          fi

      - name: Report leak as issue
        if: steps.scan.outputs.rc == '2' && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_REF: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const findings = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/gitleaks-report.json`, 'utf8'));
            const repoBase = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoBase}/actions/runs/${context.runId}`;
            const scheduled = process.env.SCAN_EVENT !== 'push';

            const rows = findings.slice(0, 50).map(f => {
              const commit = `[\`${f.Commit.slice(0, 8)}\`](${repoBase}/commit/${f.Commit})`;
              return `| \`${f.RuleID}\` | \`${f.File}:${f.StartLine}\` | ${commit} | \`${f.Fingerprint}\` |`;
            });
            const more = findings.length > 50 ? `\n_…and ${findings.length - 50} more (see the run log)._` : '';

            const body = [
              '## 🚨 Possible secret leak detected',
              '',
              `gitleaks found **${findings.length}** finding(s) ` +
                (scheduled
                  ? 'during the scheduled full-history scan.'
                  : `in a push to \`${process.env.SCAN_REF}\`.`),
              '',
              '| Rule | Location | Commit | Fingerprint |',
              '| --- | --- | --- | --- |',
              ...rows,
              more,
              '',
              '### Action Required',
              '',
              '1. **Rotate/revoke the credential first.** Removing it from git does not un-leak it — ' +
                'assume it is compromised, especially in a public repository.',
              '2. Remove it from the code and history if appropriate.',
              '3. If a finding is a false positive, add its fingerprint to `.gitleaksignore` ' +
                '(or an allowlist to `.gitleaks.toml`) via PR.',
              '',
              '### Scan Details',
              '',
              `- **Scan Date:** ${new Date().toISOString()}`,
              `- **Trigger:** ${process.env.SCAN_EVENT}`,
              `- **Run:** ${runUrl}`,
              '',
              '---',
              '*This issue was automatically created by the secret-scan workflow. Values are redacted.*',
            ].join('\n');

            const title = '🚨 Secret leak detected (gitleaks)';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });
            const existing = issues.data.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body
              });
              if (!scheduled) {
                // A comment (not just an edit) so a fresh push leak notifies.
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `🚨 New push-time detection on \`${process.env.SCAN_REF}\`: `
                    + `${findings.length} finding(s). ${runUrl}`
                });
              }
              console.log(`📝 Updated existing secret-leak issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'automated', 'bug']
              });
              console.log(`📝 Created secret-leak issue #${created.data.number}`);
            }

      - name: Fail on leaked secrets
        if: steps.scan.outputs.rc == '2'
        run: |
          echo "::error::gitleaks detected possible secrets. Rotate them first," \
            "then remove or allowlist them. Values are redacted in the log."
          exit 1
