---
name: CI/CD

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'
      test-runner:
        description: >-
          Runner for the test job specifically, as a JSON array or JSON string
          (e.g. '["self-hosted","linux","generic"]' or '"ubuntu-latest"').
          Defaults to the same value as `runner`; override for jobs that need
          a github-hosted runner (e.g. Docker Buildx amd64 builds).
        type: string
        default: '["self-hosted","linux","generic"]'
      code-paths:
        description: >-
          Full contents of the paths-filter "code" list, as comma-separated
          quoted globs (e.g. "'**/*.go', 'go.mod', 'go.sum'"). Repos whose
          code isn't shell/Python (Go, Dockerfiles, DNS zone files, etc.)
          pass their own complete list here instead of appending to it.
        type: string
        default: >-
          '**/*.sh', '**/*.bash', '**/*.py', '.github/workflows/**',
          '.pre-commit-config.yaml', 'package*.json', '.releaserc.json'
      language-setup:
        description: 'Language toolchain to install in the test job: none, go, or uv'
        type: string
        default: none
      test-timeout-minutes:
        description: Timeout (minutes) for the test job
        type: number
        default: 15
      docker-buildx:
        description: Set up Docker Buildx before running tests (container repos)
        type: boolean
        default: false
    secrets:
      PULL_REQUEST_TOKEN:
        description: >-
          Token used as GH_TOKEN for the docker-buildx test path. Only
          required when docker-buildx is true; harmless if omitted otherwise.
        required: false

permissions:
  contents: read
  pull-requests: read

# ==============================================================================
# SHARED WORKFLOW - ci-cd.yml
# ==============================================================================
# 3-phase CI/CD architecture, phase 1 (PR validation). Consumers trigger this
# via their own .github/workflows/ci-cd.yml wrapper, which owns the
# `on: pull_request` trigger and the concurrency group. See
# check-release-label.yml for phase-agnostic release label enforcement.
#
# Phase 1: PR Validation (this file)  → pull_request trigger
# Phase 2: Post-Merge Pipeline (cd.yml) → push to main trigger
# Phase 3: Release & Deploy (release.yml) → tag push trigger
#
# Core jobs: detect-changes, check-trigger, test. Release-label enforcement is
# intentionally NOT here — it lives in each consumer's own release-label.yml
# wrapper (own `on: pull_request` with labeled/unlabeled types, own
# concurrency group) so that relabeling a PR only ever reruns the cheap label
# check, not this whole job chain. See check-release-label.yml.
# ==============================================================================

jobs:
  detect-runner:
    name: Detect Runner
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      test-runner: ${{ steps.pick.outputs.test-runner }}
    steps:
      - name: Pick runner
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          DEFAULT_RUNNER: ${{ inputs.runner }}
          DEFAULT_TEST_RUNNER: ${{ inputs.test-runner }}
          DOCKER_BUILDX: ${{ inputs.docker-buildx }}
        run: |
          set -Eeuo pipefail
          # See pr-check.yml's detect-runner for the full rationale: untrusted
          # only when the PR comes from an actual fork, never for a branch
          # pushed directly into this repo or a non-pull_request event.
          # Deliberately not gated on repo visibility: a currently-private
          # repo can still gain an external collaborator with read access
          # later, who could then fork and PR - fork-origin alone is the
          # correct, durable signal.
          untrusted_fork=false
          if [[ "${EVENT_NAME}" == "pull_request" && "${HEAD_REPO}" != "${BASE_REPO}" ]]; then
            untrusted_fork=true
          fi
          if [[ "${untrusted_fork}" == "true" ]]; then
            echo 'runner=["ubuntu-slim"]' >> "$GITHUB_OUTPUT"
            # ubuntu-slim can't do container builds - an untrusted fork's
            # docker-buildx test job needs the full ubuntu-latest image, not
            # the ephemeral-but-incapable slim one.
            if [[ "${DOCKER_BUILDX}" == "true" ]]; then
              echo 'test-runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            else
              echo 'test-runner=["ubuntu-slim"]' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "runner=${DEFAULT_RUNNER}" >> "$GITHUB_OUTPUT"
            echo "test-runner=${DEFAULT_TEST_RUNNER}" >> "$GITHUB_OUTPUT"
          fi

  detect-changes:
    name: Detect Changed Files
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runner) }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      release-config: ${{ steps.filter.outputs.release-config }}
      workflow-config: ${{ steps.filter.outputs.workflow-config }}
      has-dependency-check-config: ${{ steps.dep-check-config.outputs.exists }}
      has-local-release-tooling: ${{ steps.release-tooling-exists.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code: [ ${{ inputs.code-paths }} ]
            docs:
              - '**/*.md'
              - '.gitignore'
              - 'LICENSE'
              - 'CLAUDE.md'
              - '.yamllint'
              - '.markdownlint.json'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'
            release-config:
              - '.releaserc.json'
              - 'package.json'
              - 'package-lock.json'
            # Scoped separately from "code" (which already includes
            # .github/workflows/** but also fires on nearly every ordinary
            # code PR) so the toolchain smoke-test jobs below only run on
            # PRs that actually touch a workflow file — in practice almost
            # exclusively Renovate's own GitHub Actions digest-bump PRs.
            workflow-config:
              - '.github/workflows/**'

      # dependency-check.yml hard-fails if invoked against a repo lacking
      # its config file; this is the same kind of pre-checkout existence
      # test that can't be expressed as a job-level `if: hashFiles(...)`
      # (hashFiles needs an already-checked-out workspace). Gated on the
      # filter step's own output (not a separate job) so it's skipped on
      # the vast majority of PRs where workflow-config is false, matching
      # the "don't tax ordinary PRs" goal above.
      - name: Check for dependency-checks config
        if: steps.filter.outputs.workflow-config == 'true'
        id: dep-check-config
        run: |
          if [[ -f .github/dependency-checks.yml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # verify-release-notes below runs `npm ci` against whatever
      # package.json is in the consumer's own checkout — repos that have
      # adopted the centralized release tooling (see cd.yml's "Checkout
      # release tooling" step) no longer vendor one, so there's nothing
      # local to dry-run here; that verification now happens once, in
      # miikkak/workflows' own PR pipeline, whenever ITS package.json/
      # .releaserc.json change. Skipped like dep-check-config above when
      # release-config is false, so has-local-release-tooling is left unset
      # on those runs — safe only because verify-release-notes' `if` checks
      # release-config == 'true' first and short-circuits before reading it.
      - name: Check for local release tooling
        if: steps.filter.outputs.release-config == 'true'
        id: release-tooling-exists
        run: |
          if [[ -f package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  check-trigger:
    name: Check PR Trigger
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runner) }}
    timeout-minutes: 5
    needs: [detect-runner, detect-changes]
    if: needs.detect-runner.result == 'success' && needs.detect-changes.result == 'success'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      skip_code_checks: ${{ steps.check.outputs.skip_code_checks }}
    steps:
      - name: Check trigger conditions
        id: check
        run: |
          CODE_CHANGES="${{ needs.detect-changes.outputs.code }}"
          if [[ "$CODE_CHANGES" == "true" ]]; then
            echo "✅ Running full test suite (code changes detected)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_code_checks=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Skipping code checks (docs-only changes)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_code_checks=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Test Suite
    runs-on: ${{ fromJson(needs.detect-runner.outputs.test-runner) }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    needs: [detect-runner, check-trigger]
    if: |
      needs.detect-runner.result == 'success' &&
      needs.check-trigger.outputs.should_run == 'true' &&
      needs.check-trigger.outputs.skip_code_checks == 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        if: inputs.language-setup == 'go' && runner.environment == 'github-hosted'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up uv
        if: inputs.language-setup == 'uv' && runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Docker Buildx
        if: inputs.docker-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Run repository tests
        env:
          GH_TOKEN: ${{ inputs.docker-buildx && secrets.PULL_REQUEST_TOKEN || '' }}
        run: |
          if [[ -f .github/scripts/run-tests.sh ]]; then
            bash .github/scripts/run-tests.sh
          else
            echo "ℹ️  No test script found (0/0 tests) — OK"
          fi

  verify-release-notes:
    name: Verify Release Notes Generation
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runner) }}
    timeout-minutes: 5
    needs: [detect-runner, detect-changes, check-trigger]
    if: |
      needs.detect-runner.result == 'success' &&
      needs.check-trigger.outputs.should_run == 'true' &&
      needs.detect-changes.outputs.release-config == 'true' &&
      needs.detect-changes.outputs.has-local-release-tooling == 'true'
    # Catches semantic-release toolchain breakage (e.g. a changelog preset
    # bump that's incompatible with the pinned conventional-changelog-writer
    # major) at PR review time instead of at the next labeled post-merge
    # release. --dry-run skips tagging/publishing but still runs the same
    # generateNotes render cd.yml's real run performs, against this repo's
    # actual tags/commit history.
    #
    # contents: write, despite --dry-run never actually pushing: semantic-
    # release's verifyAuth() runs `git push --dry-run` as a genuine no-op
    # permission probe, and with contents: read that probe fails outright
    # (not a branch-mismatch issue) — which then falls through to a second
    # check (isBranchUpToDate, comparing local HEAD against the real
    # remote main tip) that can never pass for a PR's synthetic merge
    # commit regardless of any branch-name spoofing. Confirmed empirically:
    # with contents: read, the verifyAuth push probe fails outright
    # (permission denied), and the run short-circuits at "The local branch
    # main is behind the remote one" instead of ever reaching "Allowed to
    # push to the Git repository".
    permissions:
      contents: write
    steps:
      # Default checkout for a pull_request event fetches GitHub's synthetic
      # refs/pull/N/merge commit (base + PR head merged) in detached HEAD
      # state — the actual content that would land on main if this PR merged.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      # npm ci (not install) so a package.json changed without a matching
      # package-lock.json update fails loudly here instead of silently.
      - name: Install dependencies
        run: npm ci

      # GITHUB_REF override, not a git-branch alias: semantic-release's
      # branch check reads env-ci's `prBranch`, not git state at all.
      # env-ci's GitHub Actions detector computes prBranch from
      # `parseBranch(env.GITHUB_REF)` — and GITHUB_REF for a pull_request
      # event is the synthetic `refs/pull/N/merge` ref, never the PR's own
      # branch name and never "main", regardless of what local branch HEAD
      # is checked out as. semantic-release's run() then does
      # `ciBranch = isPr ? prBranch : branch`, so as long as GITHUB_EVENT_NAME
      # is "pull_request" (isPr stays true), only overriding GITHUB_REF
      # itself gets ciBranch to resolve to a name matching .releaserc.json's
      # `branches: ["main"]` — confirmed by reading env-ci's actual source
      # (node_modules/env-ci/services/github.js) and semantic-release's
      # index.js after the previous git-checkout-based alias turned out to
      # be a complete no-op (verified: it always short-circuited at "This
      # test run was triggered on the branch refs/pull/N/merge", meaning
      # generateNotes never actually ran against real content, on any PR,
      # since this job was added in #152).
      # A step-level `env:` override of GITHUB_REF is silently ineffective
      # on the actual runner (confirmed: present in the workflow file, works
      # when reproduced locally, still short-circuits identically in real
      # CI) — exporting it inline within the script itself, in the same
      # shell process that invokes node, is what actually sticks.
      - name: Dry-run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TYPE: patch
        run: |
          export GITHUB_REF=refs/heads/main
          npx semantic-release --dry-run --no-ci


  # ============================================================================
  # Post-merge/scheduled-only toolchain smoke tests — REMOVED, see #165
  # ============================================================================
  # #153 added verify-security-scan/verify-dependency-check/verify-release-tarball
  # here: jobs with `needs: [detect-changes, check-trigger]` PLUS a job-level
  # `uses:` reusable-workflow reference back into this same repo
  # (miikkak/workflows/...@main), meant to smoke-test security-scan.yml/
  # dependency-check.yml/release-tarball.yml from a consumer repo's PR before
  # a broken shared-workflow digest bump ships. All three consistently hit
  # startup_failure with 0 jobs created for EVERY consumer repo, at every
  # digest — including after #156's relative->fully-qualified fix, which only
  # addressed the wrong-repo-resolution half of the problem.
  #
  # Isolated by testing against a real consumer repo (version-logger):
  # stripping all three jobs (this commit) is what actually fixes it — not
  # narrowing to just the release-tarball.yml one (which itself has a further
  # relative nested call to validate-tag.yml, the theory tried first). The
  # `needs:` + self-referential-`uses:` combination appears to be the real
  # trigger, not just the double-nesting release-tarball.yml has; self-cd.yml
  # -> cd.yml and every consumer's release.yml -> release-tarball.yml both
  # work, but neither of those reusable-workflow jobs has a `needs:` on a
  # sibling regular job the way these three did.
  #
  # See #165 for reinstating this coverage without a nested reusable-workflow
  # `uses:` — e.g. inlined smoke-test steps (the shape self-release.yml had to
  # move to for release-tarball.yml, for the same underlying reason).
