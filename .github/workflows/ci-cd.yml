---
name: CI/CD

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'
      test-runner:
        description: >-
          Runner for the test job specifically, as a JSON array or JSON string
          (e.g. '["self-hosted","linux","generic"]' or '"ubuntu-latest"').
          Defaults to the same value as `runner`; override for jobs that need
          a github-hosted runner (e.g. Docker Buildx amd64 builds).
        type: string
        default: '["self-hosted","linux","generic"]'
      code-paths:
        description: >-
          Full contents of the paths-filter "code" list, as comma-separated
          quoted globs (e.g. "'**/*.go', 'go.mod', 'go.sum'"). Repos whose
          code isn't shell/Python (Go, Dockerfiles, DNS zone files, etc.)
          pass their own complete list here instead of appending to it.
        type: string
        default: >-
          '**/*.sh', '**/*.bash', '**/*.py', '.github/workflows/**',
          '.pre-commit-config.yaml', 'package*.json', '.releaserc.json'
      language-setup:
        description: 'Language toolchain to install in the test job: none, go, or uv'
        type: string
        default: none
      test-timeout-minutes:
        description: Timeout (minutes) for the test job
        type: number
        default: 15
      docker-buildx:
        description: Set up Docker Buildx before running tests (container repos)
        type: boolean
        default: false
    secrets:
      PULL_REQUEST_TOKEN:
        description: >-
          Token used as GH_TOKEN for the docker-buildx test path. Only
          required when docker-buildx is true; harmless if omitted otherwise.
        required: false

permissions:
  contents: read
  pull-requests: read

# ==============================================================================
# SHARED WORKFLOW - ci-cd.yml
# ==============================================================================
# 3-phase CI/CD architecture, phase 1 (PR validation). Consumers trigger this
# via their own .github/workflows/ci-cd.yml wrapper, which owns the
# `on: pull_request` trigger and the concurrency group. See
# check-release-label.yml for phase-agnostic release label enforcement.
#
# Phase 1: PR Validation (this file)  → pull_request trigger
# Phase 2: Post-Merge Pipeline (cd.yml) → push to main trigger
# Phase 3: Release & Deploy (release.yml) → tag push trigger
#
# Core jobs: detect-changes, check-trigger, test. Release-label enforcement is
# intentionally NOT here — it lives in each consumer's own release-label.yml
# wrapper (own `on: pull_request` with labeled/unlabeled types, own
# concurrency group) so that relabeling a PR only ever reruns the cheap label
# check, not this whole job chain. See check-release-label.yml.
# ==============================================================================

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      release-config: ${{ steps.filter.outputs.release-config }}
      workflow-config: ${{ steps.filter.outputs.workflow-config }}
      has-dependency-check-config: ${{ steps.dep-check-config.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code: [ ${{ inputs.code-paths }} ]
            docs:
              - '**/*.md'
              - '.gitignore'
              - 'LICENSE'
              - 'CLAUDE.md'
              - '.yamllint'
              - '.markdownlint.json'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'
            release-config:
              - '.releaserc.json'
              - 'package.json'
              - 'package-lock.json'
            # Scoped separately from "code" (which already includes
            # .github/workflows/** but also fires on nearly every ordinary
            # code PR) so the toolchain smoke-test jobs below only run on
            # PRs that actually touch a workflow file — in practice almost
            # exclusively Renovate's own GitHub Actions digest-bump PRs.
            workflow-config:
              - '.github/workflows/**'

      # dependency-check.yml hard-fails if invoked against a repo lacking
      # its config file; this is the same kind of pre-checkout existence
      # test that can't be expressed as a job-level `if: hashFiles(...)`
      # (hashFiles needs an already-checked-out workspace). Gated on the
      # filter step's own output (not a separate job) so it's skipped on
      # the vast majority of PRs where workflow-config is false, matching
      # the "don't tax ordinary PRs" goal above.
      - name: Check for dependency-checks config
        if: steps.filter.outputs.workflow-config == 'true'
        id: dep-check-config
        run: |
          if [[ -f .github/dependency-checks.yml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  check-trigger:
    name: Check PR Trigger
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.result == 'success'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      skip_code_checks: ${{ steps.check.outputs.skip_code_checks }}
    steps:
      - name: Check trigger conditions
        id: check
        run: |
          CODE_CHANGES="${{ needs.detect-changes.outputs.code }}"
          if [[ "$CODE_CHANGES" == "true" ]]; then
            echo "✅ Running full test suite (code changes detected)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_code_checks=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Skipping code checks (docs-only changes)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_code_checks=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Test Suite
    runs-on: ${{ fromJson(inputs.test-runner) }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true' && needs.check-trigger.outputs.skip_code_checks == 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        if: inputs.language-setup == 'go' && runner.environment == 'github-hosted'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up uv
        if: inputs.language-setup == 'uv' && runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Docker Buildx
        if: inputs.docker-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Run repository tests
        env:
          GH_TOKEN: ${{ inputs.docker-buildx && secrets.PULL_REQUEST_TOKEN || '' }}
        run: |
          if [[ -f .github/scripts/run-tests.sh ]]; then
            bash .github/scripts/run-tests.sh
          else
            echo "ℹ️  No test script found (0/0 tests) — OK"
          fi

  verify-release-notes:
    name: Verify Release Notes Generation
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 5
    needs: [detect-changes, check-trigger]
    if: needs.check-trigger.outputs.should_run == 'true' && needs.detect-changes.outputs.release-config == 'true'
    # Catches semantic-release toolchain breakage (e.g. a changelog preset
    # bump that's incompatible with the pinned conventional-changelog-writer
    # major) at PR review time instead of at the next labeled post-merge
    # release. --dry-run skips tagging/publishing but still runs the same
    # generateNotes render cd.yml's real run performs, against this repo's
    # actual tags/commit history.
    #
    # GITHUB_TOKEN is intentionally left at the workflow's default
    # `contents: read, pull-requests: read` — --dry-run never pushes, so no
    # write scope is needed here.
    permissions:
      contents: read
    steps:
      # Default checkout for a pull_request event fetches GitHub's synthetic
      # refs/pull/N/merge commit (base + PR head merged) in detached HEAD
      # state — the actual content that would land on main if this PR merged.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Alias detached HEAD to a local branch literally named "main" so
      # semantic-release's branch check (.releaserc.json lists "main") passes
      # without changing which commit/content is tested. Combined with
      # --no-ci below, this makes semantic-release detect the branch from
      # git state instead of $GITHUB_HEAD_REF (which is always the PR's own
      # branch name during a pull_request run, never "main").
      - name: Alias merge-preview commit to main
        run: git checkout -B main

      - name: Set up Node.js
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      # npm ci (not install) so a package.json changed without a matching
      # package-lock.json update fails loudly here instead of silently.
      - name: Install dependencies
        run: npm ci

      - name: Dry-run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TYPE: patch
        run: npx semantic-release --dry-run --no-ci


  # ============================================================================
  # Post-merge/scheduled-only toolchain smoke tests — REMOVED, see #164
  # ============================================================================
  # #153 added verify-security-scan/verify-dependency-check/verify-release-tarball
  # here: jobs with `needs: [detect-changes, check-trigger]` PLUS a job-level
  # `uses:` reusable-workflow reference back into this same repo
  # (miikkak/workflows/...@main), meant to smoke-test security-scan.yml/
  # dependency-check.yml/release-tarball.yml from a consumer repo's PR before
  # a broken shared-workflow digest bump ships. All three consistently hit
  # startup_failure with 0 jobs created for EVERY consumer repo, at every
  # digest — including after #156's relative->fully-qualified fix, which only
  # addressed the wrong-repo-resolution half of the problem.
  #
  # Isolated by testing against a real consumer repo (version-logger):
  # stripping all three jobs (this commit) is what actually fixes it — not
  # narrowing to just the release-tarball.yml one (which itself has a further
  # relative nested call to validate-tag.yml, the theory tried first). The
  # `needs:` + self-referential-`uses:` combination appears to be the real
  # trigger, not just the double-nesting release-tarball.yml has; self-cd.yml
  # -> cd.yml and every consumer's release.yml -> release-tarball.yml both
  # work, but neither of those reusable-workflow jobs has a `needs:` on a
  # sibling regular job the way these three did.
  #
  # See #164 for reinstating this coverage without a nested reusable-workflow
  # `uses:` — e.g. inlined smoke-test steps (the shape self-release.yml had to
  # move to for release-tarball.yml, for the same underlying reason).
