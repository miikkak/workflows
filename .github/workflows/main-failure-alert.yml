# Opens an issue when a workflow fails on the default branch, and closes it
# again when that workflow next succeeds there.
#
# Why: a red check on main blocks nothing (it is not a required check on the
# PRs that follow), so it was only ever noticed by reading Actions logs. A
# failing Super-Linter on main went unnoticed for days that way.
#
# How: called from a small `workflow_run` workflow in each repo (see the
# README). One open issue per failing workflow, titled
# "CI failing on <branch>: <workflow>", labelled `ci-failure`. A repeated
# failure edits that issue's body to point at the latest run (no new
# notification per run); a later success comments and closes it.
#
# Deliberately a single self-contained job: no nested reusable-workflow calls
# back into this repo (see self-verify-toolchains.yml for why).
name: Main Failure Alert

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'

# One alert job at a time per workflow, so two runs finishing together do not
# both create the same issue. Never cancel a running alert job (it could stop
# halfway through an issue update). GitHub may drop an older pending completion
# in favour of a newer one; that is harmless because the script only acts when
# the completed run is still the newest run of its workflow on the branch.
concurrency:
  group: main-failure-alert-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert:
    name: Main Failure Alert
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    timeout-minutes: 5
    # Only completed runs on the default branch that were not started by a
    # pull request. The caller already filters branches; this keeps the
    # workflow safe if a caller forgets to. pull_request_target runs execute
    # in the default-branch context, so they must be excluded explicitly.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.event != 'pull_request'
      && github.event.workflow_run.event != 'pull_request_target'
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Open, update or close the failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const label = 'ci-failure';
            // Names are user-controlled text. Markdown (links, code spans) needs
            // brackets and backticks neutralised, so use plain() there. An issue
            // title is plain text: only line breaks are collapsed, which keeps it
            // the exact workflow name (so "Build [prod]" and "Build 'prod'" stay
            // distinct) and doubles as the lookup key.
            const plain = s => String(s).replace(/[\r\n]+/g, ' ').replace(/[\[\]`]/g, "'");
            const name = plain(run.name);
            const title = `CI failing on ${run.head_branch}: ${String(run.name).replace(/[\r\n]+/g, ' ')}`;
            const failedConclusions = new Set(['failure', 'timed_out', 'startup_failure']);
            const actionable = c => c === 'success' || failedConclusions.has(c);
            const sha = run.head_sha.slice(0, 7);

            if (!actionable(run.conclusion)) {
              // cancelled, skipped, neutral, ...: says nothing about health.
              console.log(`ℹ️ ignoring conclusion "${run.conclusion}"`);
              return;
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: label, state: 'open', per_page: 100,
            });
            const existing = open.find(i => i.title === title && !i.pull_request);

            // Durable ordering that cannot move backward: the issue body records the
            // newest failing run it was written for. A stale listWorkflowRuns result
            // can then neither let an older success close the issue of a newer
            // failure, nor let an older failure overwrite a newer one. An issue
            // without the marker (hand-edited, or from before it existed) is not
            // constrained.
            const marker = /<!-- main-failure-alert: run=(\d+) attempt=(\d+) -->/
              .exec((existing && existing.body) || '');
            const recordedRun = marker ? Number(marker[1]) : null;
            const recordedAttempt = marker ? Number(marker[2]) : null;
            const newerThanRecorded = !marker || run.id > recordedRun ||
              (run.id === recordedRun && run.run_attempt > recordedAttempt);
            const notOlderThanRecorded = !marker || newerThanRecorded ||
              (run.id === recordedRun && run.run_attempt === recordedAttempt);

            // Runs can finish out of order. Only act on this run if it is still
            // the newest actionable completed run of its workflow on this branch;
            // otherwise a late success could close an issue for a newer,
            // still-failing commit (or a late failure could reopen one for a
            // newer, green commit). The newer run's own completion will update the
            // issue instead. "Newest" looks past runs that must not count:
            //  - pull request runs (a fork PR from a branch called "main" has
            //    head_branch "main"; pull_request_target runs on the default branch),
            //  - cancelled/skipped/neutral runs, which say nothing about health.
            // Run ids only grow, so "newer" means a larger id; a run that is merely
            // missing from the (eventually consistent) listing is not newer. A
            // re-run keeps the run id and raises run_attempt, so compare that too.
            const recent = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: run.workflow_id, branch: run.head_branch,
              status: 'completed', per_page: 100,
            });
            const latest = recent.data.workflow_runs.find(r =>
              r.event !== 'pull_request' && r.event !== 'pull_request_target' &&
              actionable(r.conclusion));
            if (latest && (latest.id > run.id ||
                (latest.id === run.id && latest.run_attempt > run.run_attempt))) {
              console.log(`ℹ️ run ${run.id} (attempt ${run.run_attempt}) is superseded by ` +
                `run ${latest.id} (attempt ${latest.run_attempt}); not touching the issue`);
              return;
            }

            if (run.conclusion === 'success') {
              if (!existing) {
                console.log(`✅ ${name} passing, no open issue`);
                return;
              }
              if (!newerThanRecorded) {
                console.log(`ℹ️ run ${run.id} is not newer than the failing run ${recordedRun} ` +
                  `recorded in #${existing.number}; leaving it open`);
                return;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `✅ Passing again: ${run.html_url} (\`${sha}\`). Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number,
                state: 'closed', state_reason: 'completed',
              });
              console.log(`✅ Closed #${existing.number}`);
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            const failedJobs = jobs
              .filter(j => ['failure', 'timed_out'].includes(j.conclusion))
              .map(j => {
                const step = (j.steps || []).find(s => s.conclusion === 'failure');
                return `- [${plain(j.name)}](${j.html_url})` + (step ? ` — step \`${plain(step.name)}\`` : '');
              });

            // Subject line only, in code formatting: no @mentions, no markdown.
            // Handles CRLF messages and drops control characters; truncates by
            // code point so an emoji is never cut in half.
            const subject = Array.from(((run.head_commit && run.head_commit.message) || '')
              .split(/\r?\n/)[0].replace(/[\u0000-\u001f]/g, ' ').replace(/`/g, "'"))
              .slice(0, 120).join('');
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${run.head_sha}`;

            const body = [
              `## ❌ ${name} is failing on \`${run.head_branch}\``,
              '',
              `Latest failing run: ${run.html_url}`,
              '',
              `- **Commit:** [\`${sha}\`](${commitUrl})` + (subject ? ` \`${subject}\`` : ''),
              `- **Trigger:** ${run.event}`,
              `- **Conclusion:** ${run.conclusion}`,
              `- **Seen:** ${new Date().toISOString()}`,
              '',
              '### Failed jobs',
              '',
              ...(failedJobs.length ? failedJobs : ['_No failed job reported; see the run._']),
              '',
              'This issue is updated while the workflow keeps failing and closes ' +
                'itself when it next succeeds on this branch.',
              '',
              '---',
              '*Created automatically by the main-failure-alert workflow.*',
              `<!-- main-failure-alert: run=${run.id} attempt=${run.run_attempt} -->`,
            ].join('\n');

            if (existing) {
              if (!notOlderThanRecorded) {
                console.log(`ℹ️ run ${run.id} is older than the failing run ${recordedRun} ` +
                  `recorded in #${existing.number}; not overwriting it`);
                return;
              }
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              });
              console.log(`📝 Updated #${existing.number}`);
              return;
            }
            // The lookup above filters by label, so the labels must really exist:
            // issue creation can silently drop a label that is missing, which
            // would leave the issue unlabelled, unfindable on the next failure
            // (duplicates) and impossible to auto-close. Look first (one cheap GET
            // in the normal case); create only when it is missing. A 422 on create
            // can mean another run just created it, so confirm it is really there
            // before moving on instead of assuming.
            const ensureLabel = async (labelName, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
                return;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              try {
                await github.rest.issues.createLabel({ owner, repo, name: labelName, color, description });
              } catch (e) {
                if (e.status !== 422) throw e;
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
              }
            };
            await ensureLabel(label, 'b60205', 'A workflow is failing on the default branch');
            await ensureLabel('automated', 'ededed', 'Created by an automated workflow');
            const created = await github.rest.issues.create({
              owner, repo, title, body, labels: [label, 'automated'],
            });
            console.log(`📝 Created #${created.data.number}`);
