---
name: Dependency Check

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'
      config-file:
        description: Path to the dependency-checks config file in the calling repo
        default: .github/dependency-checks.yml
        type: string
      dry-run:
        description: >-
          Run every configured check for real, but skip creating/updating
          tracking issues and dispatching auto-update workflows. Used to
          smoke-test this workflow's pinned actions and check logic (crane,
          gh api, Oracle registry auth) from a PR without side effects.
        required: false
        type: boolean
        default: false
    secrets:
      pull-request-token:
        description: >-
          PAT with read access to other private repos owned by the same
          account. Only needed if a `github-release` check in the calling
          repo's config targets a different private repo - the default
          token can only read the calling repo itself. Falls back to the
          default token when not provided.
        required: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  parse-config:
    name: Parse Config
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      has-checks: ${{ steps.parse.outputs.has-checks }}
    env:
      PYYAML_VERSION: "6.0.3"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pyyaml
        run: |
          python3 -m venv "$RUNNER_TEMP/dep-check-venv"
          "$RUNNER_TEMP/dep-check-venv/bin/pip" install "pyyaml==${{ env.PYYAML_VERSION }}" -q
          echo "$RUNNER_TEMP/dep-check-venv/bin" >> "$GITHUB_PATH"

      - name: Parse dependency-checks config
        id: parse
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          import yaml

          config_file = os.environ["CONFIG_FILE"]
          if not os.path.exists(config_file):
            print(f"❌ Config file not found: {config_file}", file=sys.stderr)
            sys.exit(1)

          try:
            with open(config_file) as f:
              config = yaml.safe_load(f)
          except yaml.YAMLError as e:
            print(f"❌ Failed to parse config file {config_file}: {e}", file=sys.stderr)
            sys.exit(1)

          checks = config.get("checks", []) if isinstance(config, dict) else []
          matrix = json.dumps({"include": checks})

          output_file = os.environ["GITHUB_OUTPUT"]
          with open(output_file, "a") as out:
            out.write(f"matrix={matrix}\n")
            out.write(f"has-checks={'true' if checks else 'false'}\n")

          print(f"✅ Parsed {len(checks)} check(s): {[c.get('name', 'unnamed') for c in checks]}")
          PYEOF

  check:
    name: Check ${{ matrix.name }}
    needs: parse-config
    if: needs.parse-config.outputs.has-checks == 'true'
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    strategy:
      matrix: ${{ fromJson(needs.parse-config.outputs.matrix) }}
      fail-fast: false
    env:
      CRANE_VERSION: "0.20.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── docker-digest handler ──────────────────────────────────────────────

      - name: Install crane
        if: matrix.type == 'docker-digest'
        run: |
          case "$(uname -m)" in
            x86_64)  arch="x86_64" ;;
            aarch64) arch="arm64" ;;
            *)       echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          base_url="https://github.com/google/go-containerregistry/releases/download"
          curl -sL "${base_url}/v${CRANE_VERSION}/go-containerregistry_Linux_${arch}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" crane

      - name: Check docker digest
        if: matrix.type == 'docker-digest'
        id: docker-digest
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_ARG: ${{ matrix.image-arg }}
          IMAGE_PREFIX: ${{ matrix.image-prefix }}
          FILE: ${{ matrix.file }}
        run: |
          # Resolve full image name (static or derived from a Dockerfile ARG)
          if [[ -n "${IMAGE:-}" ]]; then
            FULL_IMAGE="$IMAGE"
          elif [[ -n "${IMAGE_ARG:-}" && -n "${IMAGE_PREFIX:-}" ]]; then
            VERSION=$(grep -Fm1 "ARG ${IMAGE_ARG}=" "$FILE" | cut -d'=' -f2 | tr -d "\"'")
            if [[ -z "$VERSION" ]]; then
              echo "❌ Could not extract ARG ${IMAGE_ARG} from $FILE"
              exit 1
            fi
            FULL_IMAGE="${IMAGE_PREFIX}:${VERSION}"
          else
            echo "❌ Either 'image' or both 'image-arg' and 'image-prefix' must be set"
            exit 1
          fi
          echo "current-image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "📦 Checking image: $FULL_IMAGE"

          # Extract the pinned digest from the file (-F: fixed string, image name has dots)
          STORED_DIGEST=$(grep -Fm1 "FROM ${FULL_IMAGE}" "$FILE" \
            | grep -oE 'sha256:[0-9a-f]{64}' || echo "unknown")
          if [[ "$STORED_DIGEST" == "unknown" ]]; then
            echo "⚠️ No digest pinned in $FILE for $FULL_IMAGE"
          else
            echo "📦 Stored digest: $STORED_DIGEST"
          fi
          echo "current=$STORED_DIGEST" >> "$GITHUB_OUTPUT"

          # Get the latest digest from the registry (crane talks to the registry HTTP API
          # directly — no Docker daemon needed, compatible with ubuntu-slim)
          LATEST_DIGEST=$(crane digest "$FULL_IMAGE" 2>/dev/null || echo "unknown")
          echo "latest=$LATEST_DIGEST" >> "$GITHUB_OUTPUT"
          echo "📦 Latest registry digest: $LATEST_DIGEST"

          if [[ "$STORED_DIGEST" == "unknown" || "$LATEST_DIGEST" == "unknown" ]]; then
            echo "update-available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Could not determine digest(s), skipping update check"
          elif [[ "$STORED_DIGEST" != "$LATEST_DIGEST" ]]; then
            echo "update-available=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Digest changed: $STORED_DIGEST → $LATEST_DIGEST"
          else
            echo "update-available=false" >> "$GITHUB_OUTPUT"
            echo "✅ Digest is current"
          fi

      # ── github-release handler ─────────────────────────────────────────────

      - name: Check github release
        if: matrix.type == 'github-release'
        id: github-release
        env:
          REPO: ${{ matrix.repo }}
          FILE: ${{ matrix.file }}
          PATTERN: ${{ matrix.pattern }}
          INCLUDE_PRERELEASE: ${{ matrix.include-prerelease }}
          GH_TOKEN: ${{ secrets.pull-request-token || github.token }}
        run: |
          # Extract current version from file
          CURRENT=$(grep -Fm1 "${PATTERN}" "$FILE" | cut -d'=' -f2)
          if [[ -z "$CURRENT" ]]; then
            echo "❌ Could not extract version from $FILE using pattern: $PATTERN"
            exit 1
          fi
          echo "📦 Current version: $CURRENT"

          # Fetch latest release from GitHub API
          if [[ "${INCLUDE_PRERELEASE:-false}" == "true" ]]; then
            # Include prereleases — pick first non-draft release
            LATEST=$(gh api "repos/${REPO}/releases" \
              --jq '[.[] | select(.draft == false)][0].tag_name')
          else
            # Default: first non-prerelease, non-draft release
            LATEST=$(gh api "repos/${REPO}/releases" \
              --jq '[.[] | select(.prerelease == false and .draft == false)][0].tag_name')
          fi

          if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
            echo "❌ Could not fetch latest release for $REPO"
            exit 1
          fi
          echo "🔍 Latest release tag: $LATEST"

          # Normalize: strip leading 'v' from both for comparison
          CURRENT_NORM="${CURRENT#v}"
          LATEST_NORM="${LATEST#v}"

          echo "current=$CURRENT_NORM" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_NORM" >> "$GITHUB_OUTPUT"

          if [[ "$CURRENT_NORM" != "$LATEST_NORM" ]]; then
            echo "update-available=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Update available: $CURRENT_NORM → $LATEST_NORM"
          else
            echo "update-available=false" >> "$GITHUB_OUTPUT"
            echo "✅ Version is current"
          fi

      # ── oracle-registry-tags handler ──────────────────────────────────────

      - name: Check Oracle registry tags
        if: matrix.type == 'oracle-registry-tags'
        id: oracle-registry-tags
        env:
          REGISTRY_REPO: ${{ matrix.registry-repo }}
          MAJOR_VERSION_FILE: ${{ matrix.major-version-file }}
          FILE: ${{ matrix.file }}
          PATTERN: ${{ matrix.pattern }}
        run: |
          # Read the major version to track
          if [[ ! -f "$MAJOR_VERSION_FILE" ]]; then
            echo "❌ Major version file not found: $MAJOR_VERSION_FILE"
            exit 1
          fi
          MAJOR_VERSION=$(tr -d '[:space:]' < "$MAJOR_VERSION_FILE")
          if [[ -z "$MAJOR_VERSION" ]]; then
            echo "❌ Major version file is empty: $MAJOR_VERSION_FILE"
            exit 1
          fi
          echo "📦 Tracking major version: $MAJOR_VERSION"

          # Extract current version from file
          CURRENT=$(grep -Fm1 "${PATTERN}" "$FILE" | cut -d'=' -f2)
          if [[ -z "$CURRENT" ]]; then
            echo "❌ Could not extract version from $FILE using pattern: $PATTERN"
            exit 1
          fi
          echo "📦 Current version: $CURRENT"

          # Obtain anonymous bearer token for Oracle Container Registry
          ORACLE_AUTH_URL="https://container-registry.oracle.com/auth"
          ORACLE_AUTH_URL+="?service=Oracle%20Registry&scope=repository:${REGISTRY_REPO}:pull"
          TOKEN=$(curl -sf "$ORACLE_AUTH_URL" | jq -r '.token') || {
            echo "❌ Failed to obtain Oracle registry auth token"
            exit 1
          }
          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "❌ Oracle registry returned empty auth token"
            exit 1
          fi

          # Fetch tags from Oracle Container Registry
          TAGS_JSON=$(curl -sf \
            -H "Authorization: Bearer $TOKEN" \
            "https://container-registry.oracle.com/v2/${REGISTRY_REPO}/tags/list") || {
            echo "❌ Failed to fetch tags from Oracle registry"
            exit 1
          }

          # Filter tags matching major.minor.patch (e.g. 25.0.3) under the tracked major
          LATEST=$(echo "$TAGS_JSON" \
            | jq -r --arg major "$MAJOR_VERSION" \
              '.tags[] | select(test("^" + $major + "\\.[0-9]+\\.[0-9]+$"))' \
            | sort -V | tail -1)

          if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
            echo "❌ No matching tags found for major version $MAJOR_VERSION"
            exit 1
          fi
          echo "🔍 Latest tag: $LATEST"

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [[ "$CURRENT" != "$LATEST" ]]; then
            echo "update-available=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Update available: $CURRENT → $LATEST"
          else
            echo "update-available=false" >> "$GITHUB_OUTPUT"
            echo "✅ Version is current"
          fi

      # ── apk-security-updates handler ────────────────────────────────────────

      - name: Check apk security updates
        if: matrix.type == 'apk-security-updates'
        id: apk-security-updates
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_ARG: ${{ matrix.image-arg }}
          IMAGE_PREFIX: ${{ matrix.image-prefix }}
          FILE: ${{ matrix.file }}
        run: |
          # Resolve full image name (static or derived from a Dockerfile ARG) -
          # same resolution as the docker-digest handler above.
          if [[ -n "${IMAGE:-}" ]]; then
            FULL_IMAGE="$IMAGE"
          elif [[ -n "${IMAGE_ARG:-}" && -n "${IMAGE_PREFIX:-}" ]]; then
            VERSION=$(grep -Fm1 "ARG ${IMAGE_ARG}=" "$FILE" | cut -d'=' -f2 | tr -d "\"'")
            if [[ -z "$VERSION" ]]; then
              echo "❌ Could not extract ARG ${IMAGE_ARG} from $FILE"
              exit 1
            fi
            FULL_IMAGE="${IMAGE_PREFIX}:${VERSION}"
          else
            echo "❌ Either 'image' or both 'image-arg' and 'image-prefix' must be set"
            exit 1
          fi

          # Test against the exact digest pinned in the file, if present, so
          # the check reflects what's actually built today, not a moving tag.
          # awk match (not grep -F substring) so e.g. "alpine:3.24" can't
          # match a "FROM alpine:3.24-edge@..." line.
          DIGEST=$(awk -v img="${FULL_IMAGE}@" '$1=="FROM" && index($2, img)==1 {print $2}' "$FILE" \
            | grep -oE 'sha256:[0-9a-f]{64}' | head -1 || echo "")
          PINNED_IMAGE="$FULL_IMAGE"
          if [[ -n "$DIGEST" ]]; then
            PINNED_IMAGE="${FULL_IMAGE%:*}@${DIGEST}"
          fi
          echo "📦 Checking apk packages for: $PINNED_IMAGE"

          # apk add --no-cache in the Dockerfile fetches from the live mirror
          # at build time regardless of the pinned base image digest, so a
          # security fix can land in the apk index without the image tag
          # ever changing. Compare against a container booted from the
          # exact pinned digest to catch that case.
          #
          # Fail the step on a pull/inspect error instead of treating it as
          # "no update available" - a network blip should not be reported as
          # a clean scan.
          if ! UPGRADES=$(docker run --rm --pull=always "$PINNED_IMAGE" \
            sh -c 'apk update >/dev/null 2>&1 && apk list -u 2>/dev/null'); then
            echo "❌ Failed to inspect apk packages for $PINNED_IMAGE"
            exit 1
          fi

          if [[ -n "$UPGRADES" ]]; then
            echo "update-available=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Package updates available:"
            echo "$UPGRADES"
            # Unique delimiter so it can't collide with a line in $UPGRADES
            DELIM="APK_SUMMARY_EOF_${GITHUB_RUN_ID:-0}_${RANDOM}"
            {
              echo "summary<<${DELIM}"
              echo "$UPGRADES"
              echo "${DELIM}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "update-available=false" >> "$GITHUB_OUTPUT"
            echo "✅ No apk package updates available"
          fi

      # ── Collect unified result ─────────────────────────────────────────────

      - name: Collect check result
        id: result
        env:
          CHECK_TYPE: ${{ matrix.type }}
          DOCKER_DIGEST_UPDATE: ${{ steps.docker-digest.outputs.update-available }}
          DOCKER_DIGEST_CURRENT: ${{ steps.docker-digest.outputs.current }}
          DOCKER_DIGEST_LATEST: ${{ steps.docker-digest.outputs.latest }}
          DOCKER_DIGEST_IMAGE: ${{ steps.docker-digest.outputs.current-image }}
          GITHUB_RELEASE_UPDATE: ${{ steps.github-release.outputs.update-available }}
          GITHUB_RELEASE_CURRENT: ${{ steps.github-release.outputs.current }}
          GITHUB_RELEASE_LATEST: ${{ steps.github-release.outputs.latest }}
          ORACLE_TAGS_UPDATE: ${{ steps.oracle-registry-tags.outputs.update-available }}
          ORACLE_TAGS_CURRENT: ${{ steps.oracle-registry-tags.outputs.current }}
          ORACLE_TAGS_LATEST: ${{ steps.oracle-registry-tags.outputs.latest }}
          APK_UPDATE: ${{ steps.apk-security-updates.outputs.update-available }}
          APK_SUMMARY: ${{ steps.apk-security-updates.outputs.summary }}
        run: |
          case "$CHECK_TYPE" in
            docker-digest)
              echo "update-available=${DOCKER_DIGEST_UPDATE}" >> "$GITHUB_OUTPUT"
              echo "current=${DOCKER_DIGEST_CURRENT}" >> "$GITHUB_OUTPUT"
              echo "latest=${DOCKER_DIGEST_LATEST}" >> "$GITHUB_OUTPUT"
              echo "dispatch-value=${DOCKER_DIGEST_LATEST}" >> "$GITHUB_OUTPUT"
              ;;
            github-release)
              echo "update-available=${GITHUB_RELEASE_UPDATE}" >> "$GITHUB_OUTPUT"
              echo "current=${GITHUB_RELEASE_CURRENT}" >> "$GITHUB_OUTPUT"
              echo "latest=${GITHUB_RELEASE_LATEST}" >> "$GITHUB_OUTPUT"
              echo "dispatch-value=${GITHUB_RELEASE_LATEST}" >> "$GITHUB_OUTPUT"
              ;;
            oracle-registry-tags)
              echo "update-available=${ORACLE_TAGS_UPDATE}" >> "$GITHUB_OUTPUT"
              echo "current=${ORACLE_TAGS_CURRENT}" >> "$GITHUB_OUTPUT"
              echo "latest=${ORACLE_TAGS_LATEST}" >> "$GITHUB_OUTPUT"
              echo "dispatch-value=${ORACLE_TAGS_LATEST}" >> "$GITHUB_OUTPUT"
              ;;
            apk-security-updates)
              echo "update-available=${APK_UPDATE}" >> "$GITHUB_OUTPUT"
              # Randomized delimiter here too - re-serializing APK_SUMMARY
              # with a fixed delimiter would reintroduce the same collision
              # risk the upstream step already guards against.
              RESULT_DELIM="APK_SUMMARY_EOF_${GITHUB_RUN_ID:-0}_${RANDOM}"
              {
                echo "summary<<${RESULT_DELIM}"
                echo "${APK_SUMMARY}"
                echo "${RESULT_DELIM}"
              } >> "$GITHUB_OUTPUT"
              echo "dispatch-value=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ── Create or update issue ─────────────────────────────────────────────

      - name: Create or update issue
        if: steps.result.outputs.update-available == 'true' && inputs.dry-run != true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHECK_NAME: ${{ matrix.name }}
          CHECK_TYPE: ${{ matrix.type }}
          CURRENT: ${{ steps.result.outputs.current }}
          LATEST: ${{ steps.result.outputs.latest }}
          SUMMARY: ${{ steps.result.outputs.summary }}
          DOCKER_IMAGE: ${{ steps.docker-digest.outputs.current-image }}
        with:
          script: |
            const checkName = process.env.CHECK_NAME;
            const checkType = process.env.CHECK_TYPE;
            const current = process.env.CURRENT;
            const latest = process.env.LATEST;
            const summary = process.env.SUMMARY;
            const dockerImage = process.env.DOCKER_IMAGE;

            const issueTitle = `⬆️ ${checkName}: update available`;

            let bodyLines = [
              `## ${checkName}: update available`,
              '',
            ];

            if (checkType === 'docker-digest') {
              bodyLines.push(
                `A new digest is available for \`${dockerImage}\`.`,
                '',
                `| Field          | Value |`,
                `| -------------- | ----- |`,
                `| Image          | \`${dockerImage}\` |`,
                `| Current Digest | \`${current}\` |`,
                `| Latest Digest  | \`${latest}\` |`,
                '',
                `Update the pinned digest in the \`FROM\` line of \`Dockerfile\`.`,
              );
            } else if (checkType === 'apk-security-updates') {
              bodyLines.push(
                `The base image's apk packages have updates available in the ` +
                  `live mirror, even though the pinned base image digest hasn't ` +
                  `changed:`,
                '',
                '```',
                summary,
                '```',
                '',
                `\`apk add --no-cache\` alone won't pick these up - it never ` +
                  `upgrades an already-installed package. The rebuild PR ` +
                  `adds \`RUN apk upgrade --no-cache\` (if not already ` +
                  `present) so the rebuild actually applies them.`,
              );
            } else {
              bodyLines.push(
                `A new version is available.`,
                '',
                `| Field           | Value |`,
                `| --------------- | ----- |`,
                `| Current Version | \`${current}\` |`,
                `| Latest Version  | \`${latest}\` |`,
                '',
                `Update the version in \`Dockerfile\` and create a PR with the \`release:patch\` label.`,
              );
            }

            bodyLines.push(
              '',
              '---',
              `*Automatically created by the dependency-check workflow.*`,
              `*Last checked: ${new Date().toISOString()}*`,
            );

            const body = bodyLines.join('\n');

            // Search for existing open issue with this title
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'dependencies,automated',
              state: 'open',
            });

            const existing = issues.data.find(i => i.title === issueTitle);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              console.log(`📝 Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body,
                labels: ['dependencies', 'automated', 'enhancement'],
              });
              console.log(`📝 Created issue #${created.data.number}`);
            }

      # ── Dispatch auto-update workflow ──────────────────────────────────────

      - name: Dispatch auto-update workflow
        if: >-
          steps.result.outputs.update-available == 'true' &&
          inputs.dry-run != true &&
          matrix.auto-update-workflow != '' &&
          matrix.auto-update-workflow != null
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          AUTO_UPDATE_WORKFLOW: ${{ matrix.auto-update-workflow }}
          AUTO_UPDATE_INPUT: ${{ matrix.auto-update-input }}
          CHECK_TYPE: ${{ matrix.type }}
          CHECK_NAME: ${{ matrix.name }}
          CHECK_FILE: ${{ matrix.file }}
          DISPATCH_VALUE: ${{ steps.result.outputs.dispatch-value }}
        with:
          script: |
            const workflowId = process.env.AUTO_UPDATE_WORKFLOW;
            const checkType = process.env.CHECK_TYPE;
            const checkName = process.env.CHECK_NAME;
            const checkFile = process.env.CHECK_FILE;
            const dispatchValue = process.env.DISPATCH_VALUE;

            // Determine input key: explicit override, or type-based default
            let inputKey = process.env.AUTO_UPDATE_INPUT;
            if (!inputKey) {
              inputKey = checkType === 'docker-digest' ? 'digest'
                : checkType === 'apk-security-updates' ? 'trigger'
                : 'version';
            }

            const inputs = { [inputKey]: dispatchValue };
            // apk-security-updates has no meaningful version/digest to bump -
            // pass the check name (to close the matching tracking issue by
            // title) and the Dockerfile path (matrix.file) it checked, so
            // the rebuild workflow edits the same file rather than assuming
            // a root Dockerfile.
            if (checkType === 'apk-security-updates') {
              inputs['check-name'] = checkName;
              if (checkFile) {
                inputs['dockerfile-path'] = checkFile;
              }
            }

            console.log(`🤖 Dispatching ${workflowId} with ${JSON.stringify(inputs)}`);

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref: 'main',
                inputs,
              });
              console.log('✅ Auto-update workflow dispatched successfully');
            } catch (error) {
              console.error(`❌ Failed to dispatch auto-update workflow: ${error.message}`);
              // Non-fatal: issue was already created for manual fallback
            }
