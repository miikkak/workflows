---
name: Dependabot Automerge

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'
    secrets:
      PULL_REQUEST_TOKEN:
        description: >-
          PAT used to complete the merge. Required: a merge performed with
          the default GITHUB_TOKEN is attributed to github-actions[bot] and
          does not trigger the downstream push-to-main release workflow,
          silently skipping the release. Falls back to GITHUB_TOKEN if
          omitted, which still enables auto-merge but reintroduces that gap.
        required: false

permissions:
  contents: write
  pull-requests: write

# ==============================================================================
# SHARED WORKFLOW - dependabot-automerge.yml
# ==============================================================================
# Dependabot (unlike Renovate) has no built-in automerge config in
# dependabot.yml — GitHub's documented workaround is a workflow that enables
# GitHub's native auto-merge for patch/minor updates, gated by the repo's
# required status checks (including Release Label Check). Major bumps are
# left for manual review.
#
# Dependabot also has no built-in way to add a release: label, unlike
# Renovate's packageRules addLabels. Without one, auto-merge sits blocked
# forever on any repo where the Release Label Check is required, since
# nothing ever satisfies it. So this workflow adds the label itself:
# development-only bumps get release:none (they don't ship in the deployed
# artifact), everything else gets release:patch/release:minor to match the
# Renovate convention. Grouped/transitive npm updates (dependency-type
# "indirect") get the same release:none treatment when the repo's
# package.json has no production "dependencies" section at all.
#
# The merge itself must use a PAT (PULL_REQUEST_TOKEN), not GITHUB_TOKEN:
# GitHub attributes an auto-merge completed with the default token to
# github-actions[bot], and pushes from that identity don't trigger
# downstream push-triggered workflows (the anti-recursion guard) - so a
# correctly-labeled release:patch/minor PR would auto-merge but never
# actually trigger the release pipeline.
# ==============================================================================

jobs:
  automerge:
    name: Enable Auto-merge
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}

      - name: Add release label for patch/minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          # Grouped/transitive npm updates report dependency-type "indirect"
          # rather than "direct:development", so the substring check below
          # misses them. In repos where package.json has no top-level
          # "dependencies" section (semantic-release tooling only, nothing
          # shipped), any npm bump - direct or indirect - is dev-only.
          npm_dev_only_repo() {
            [[ "${PACKAGE_ECOSYSTEM}" == "npm_and_yarn" ]] || return 1
            local manifest_path="${DIRECTORY#/}"
            manifest_path="${manifest_path:+${manifest_path}/}package.json"
            local content
            content=$(gh api "repos/${REPO}/contents/${manifest_path}" --jq '.content' 2>/dev/null) || return 1
            ! printf '%s' "$content" | base64 -d | grep -q '"dependencies"[[:space:]]*:'
          }

          if [[ "${DEPENDENCY_TYPE}" == *development* ]]; then
            label="release:none"
          elif [[ "${DEPENDENCY_TYPE}" == "indirect" ]] && npm_dev_only_repo; then
            label="release:none"
          elif [[ "${UPDATE_TYPE}" == "version-update:semver-patch" ]]; then
            label="release:patch"
          else
            label="release:minor"
          fi
          gh pr edit "$PR_URL" --add-label "$label"

      - name: Enable auto-merge for patch/minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
