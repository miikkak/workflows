---
# Smoke-tested pre-merge by self-verify-toolchains.yml whenever this file
# changes — see that file for why, and why it's a bare uses: with no
# further nested reusable-workflow call.
name: Scheduled Security Scan

on: # yamllint disable-line rule:truthy
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}

      - name: Install Trivy
        run: |
          case "$(uname -m)" in
            x86_64)  arch="Linux-64bit" ;;
            aarch64) arch="Linux-ARM64" ;;
            *)       echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          gh release download v0.70.0 \
            --repo aquasecurity/trivy \
            --pattern "trivy_*_${arch}.tar.gz" \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Trivy filesystem scanner (table output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0" # Don't fail the workflow, just report
          skip-setup-trivy: true

      - name: Run Trivy filesystem scanner (JSON output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-fs-results.json"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Don't fail the workflow, just report
          skip-setup-trivy: true

      - name: Check for vulnerabilities and create issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            let trivyResults;
            try {
              const data = fs.readFileSync('trivy-fs-results.json', 'utf8');
              trivyResults = JSON.parse(data);
            } catch (error) {
              console.log('No vulnerabilities file found or error reading it');
              return;
            }

            let criticalCount = 0;
            let highCount = 0;

            if (trivyResults.Results) {
              trivyResults.Results.forEach(result => {
                if (result.Vulnerabilities) {
                  result.Vulnerabilities.forEach(vuln => {
                    if (vuln.Severity === 'CRITICAL') criticalCount++;
                    if (vuln.Severity === 'HIGH') highCount++;
                  });
                }
              });
            }

            if (criticalCount === 0 && highCount === 0) {
              console.log('✅ No critical or high vulnerabilities found in filesystem scan!');
              return;
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });

            const issueTitle = '🔒 Security vulnerabilities detected (filesystem scan)';
            const existingIssue = issues.data.find(issue => issue.title === issueTitle);

            const repoBase = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoBase}/actions/runs/${context.runId}`;
            const body = [
              '## 🔒 Security Vulnerabilities Detected (Filesystem Scan)',
              '',
              'Trivy security scan found vulnerabilities in the repository:',
              '',
              `- **Critical:** ${criticalCount}`,
              `- **High:** ${highCount}`,
              '',
              '### Action Required',
              '',
              '1. Review the vulnerabilities in the workflow logs (link below)',
              '2. Update affected dependencies or configurations',
              '3. Test the changes',
              '4. Create a PR with fixes',
              '',
              '### Scan Details',
              '',
              `- **Scan Date:** ${new Date().toISOString()}`,
              '- **Scan Type:** Filesystem',
              '',
              'For detailed vulnerability information, check the workflow run:',
              runUrl,
              '',
              '---',
              '*This issue was automatically created by the security-scan workflow.*',
            ].join('\n');

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`📝 Updated existing security issue #${existingIssue.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: body,
                labels: ['security', 'automated', 'bug']
              });
              console.log(`📝 Created new security issue #${newIssue.data.number}`);
            }

      - name: Run Trivy filesystem scanner (fail on critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"
          skip-setup-trivy: true

  config-scan:
    name: Trivy Config Scan
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}

      - name: Install Trivy
        run: |
          case "$(uname -m)" in
            x86_64)  arch="Linux-64bit" ;;
            aarch64) arch="Linux-ARM64" ;;
            *)       echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          gh release download v0.70.0 \
            --repo aquasecurity/trivy \
            --pattern "trivy_*_${arch}.tar.gz" \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Trivy config scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          exit-code: "0" # Don't fail the workflow, just report
          skip-setup-trivy: true

  container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}

      - name: Check for Dockerfile
        id: check_dockerfile
        run: |
          if [[ -f Dockerfile ]]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check_dockerfile.outputs.has_dockerfile == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Some repos' Dockerfiles COPY in prebuilt binaries pre-staged from
      # private-repo releases (their downloader stage can't fetch them with
      # a plain wget - see mc-server-container's Dockerfile for why). Those
      # repos provide .github/scripts/stage-build-context.sh, the same
      # script their release.yml and run-tests.sh use, so the scanned image
      # is built the exact same way. Repos without private prebuilt deps
      # don't have this script, so the step is a no-op for them.
      - name: Stage build context
        if: steps.check_dockerfile.outputs.has_dockerfile == 'true'
        env:
          GH_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -f .github/scripts/stage-build-context.sh ]]; then
            .github/scripts/stage-build-context.sh
          fi

      - name: Build container for scanning
        if: steps.check_dockerfile.outputs.has_dockerfile == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: ${{ github.event.repository.name }}:scan

      - name: Run Trivy container scanner (table output)
        if: steps.check_dockerfile.outputs.has_dockerfile == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ github.event.repository.name }}:scan"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0" # Don't fail the workflow, just report

      - name: Run Trivy container scanner (JSON output)
        if: steps.check_dockerfile.outputs.has_dockerfile == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ github.event.repository.name }}:scan"
          format: "json"
          output: "trivy-image-results.json"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Don't fail the workflow, just report

      - name: Check for container vulnerabilities and create issue
        if: steps.check_dockerfile.outputs.has_dockerfile == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            let trivyResults;
            try {
              const data = fs.readFileSync('trivy-image-results.json', 'utf8');
              trivyResults = JSON.parse(data);
            } catch (error) {
              console.log('No vulnerabilities file found or error reading it');
              return;
            }

            let criticalCount = 0;
            let highCount = 0;

            if (trivyResults.Results) {
              trivyResults.Results.forEach(result => {
                if (result.Vulnerabilities) {
                  result.Vulnerabilities.forEach(vuln => {
                    if (vuln.Severity === 'CRITICAL') criticalCount++;
                    if (vuln.Severity === 'HIGH') highCount++;
                  });
                }
              });
            }

            if (criticalCount === 0 && highCount === 0) {
              console.log('✅ No critical or high vulnerabilities found in container image!');
              return;
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });

            const issueTitle = '🔒 Security vulnerabilities detected (container scan)';
            const existingIssue = issues.data.find(issue => issue.title === issueTitle);

            const containerRepoBase = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const containerRunUrl = `${containerRepoBase}/actions/runs/${context.runId}`;
            const body = [
              '## 🔒 Security Vulnerabilities Detected (Container Image)',
              '',
              'Trivy security scan found vulnerabilities in the container image:',
              '',
              `- **Critical:** ${criticalCount}`,
              `- **High:** ${highCount}`,
              '',
              '### Action Required',
              '',
              '1. Review the vulnerabilities in the workflow logs (link below)',
              '2. Update base image or dependencies',
              '3. Rebuild and test the container',
              '4. Create a PR with fixes',
              '',
              '### Scan Details',
              '',
              `- **Scan Date:** ${new Date().toISOString()}`,
              '- **Scan Type:** Container Image',
              `- **Image:** ${{ github.event.repository.name }}:scan`,
              '',
              'For detailed vulnerability information, check the workflow run:',
              containerRunUrl,
              '',
              '---',
              '*This issue was automatically created by the security-scan workflow.*',
            ].join('\n');

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`📝 Updated existing security issue #${existingIssue.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: body,
                labels: ['security', 'automated', 'bug']
              });
              console.log(`📝 Created new security issue #${newIssue.data.number}`);
            }

      - name: Run Trivy container scanner (fail on critical)
        if: steps.check_dockerfile.outputs.has_dockerfile == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ github.event.repository.name }}:scan"
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Skip container scan (no Dockerfile)
        if: steps.check_dockerfile.outputs.has_dockerfile == 'false'
        run: echo "ℹ️ No Dockerfile found, skipping container scan"

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    env:
      GOVULNCHECK_VERSION: "v1.8.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}

      - name: Check for go.mod
        id: check_gomod
        run: |
          if [[ -f go.mod ]]; then
            echo "has_gomod=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gomod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.check_gomod.outputs.has_gomod == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Cache govulncheck binary
        if: steps.check_gomod.outputs.has_gomod == 'true'
        id: cache-govulncheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.govulncheck-bin
          key: govulncheck-${{ env.GOVULNCHECK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install govulncheck
        if: >-
          steps.check_gomod.outputs.has_gomod == 'true' &&
          steps.cache-govulncheck.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ github.workspace }}/.govulncheck-bin
        run: go install "golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}"

      - name: Run govulncheck
        if: steps.check_gomod.outputs.has_gomod == 'true'
        id: govulncheck
        run: |
          set +e
          "${{ github.workspace }}/.govulncheck-bin/govulncheck" -json ./... \
            > govulncheck-results.json
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          # govulncheck exit codes: 0 = clean, 3 = vulnerabilities found,
          # anything else = the tool itself failed to run - fail loudly here
          # instead of letting a broken invocation look like a clean scan.
          if [[ "${exit_code}" != "0" && "${exit_code}" != "3" ]]; then
            echo "::error::govulncheck failed to run (exit code ${exit_code})"
            exit "${exit_code}"
          fi

      - name: Check for vulnerabilities and create issue
        if: steps.check_gomod.outputs.has_gomod == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            // govulncheck -json emits a stream of newline-delimited JSON
            // messages, not a single JSON document - collect the ones with
            // an "osv" (vulnerability record) or "finding" (call-graph hit).
            let raw;
            try {
              raw = fs.readFileSync('govulncheck-results.json', 'utf8');
            } catch (error) {
              console.log('No govulncheck results file found');
              return;
            }

            const osvById = new Map();
            const findings = [];
            for (const line of raw.split('\n')) {
              if (!line.trim()) continue;
              let msg;
              try {
                msg = JSON.parse(line);
              } catch {
                continue;
              }
              if (msg.osv) osvById.set(msg.osv.id, msg.osv);
              if (msg.finding && msg.finding.osv) findings.push(msg.finding);
            }

            if (findings.length === 0) {
              console.log('✅ No reachable vulnerabilities found by govulncheck!');
              return;
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });

            const issueTitle = '🔒 Security vulnerabilities detected (govulncheck)';
            const existingIssue = issues.data.find(issue => issue.title === issueTitle);

            const repoBase = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoBase}/actions/runs/${context.runId}`;

            // Keep table rows to one line and immune to embedded `|`/newlines,
            // since osv.details can be multi-line prose that would otherwise
            // break the Markdown table.
            const toCell = (text, maxLen = 150) => {
              const flat = String(text).replace(/\s+/g, ' ').replace(/\|/g, '\\|').trim();
              return flat.length > maxLen ? `${flat.slice(0, maxLen - 1)}…` : flat;
            };

            const seen = new Set();
            const rows = [];
            for (const f of findings) {
              if (seen.has(f.osv)) continue;
              seen.add(f.osv);
              const osv = osvById.get(f.osv);
              const summary = osv ? osv.summary || osv.details || '' : '';
              rows.push(`| \`${f.osv}\` | \`${f.trace?.[0]?.package || 'stdlib'}\` | ${toCell(summary)} |`);
            }

            const body = [
              '## 🔒 Reachable Go Vulnerabilities Detected (govulncheck)',
              '',
              'govulncheck found vulnerabilities in code paths this module actually calls:',
              '',
              '| OSV ID | Package | Summary |',
              '| ------ | ------- | ------- |',
              ...rows,
              '',
              '### Action Required',
              '',
              '1. Review the vulnerabilities in the workflow logs (link below)',
              '2. Update the Go toolchain (go.mod `go` directive) or affected dependency',
              '3. Rebuild and cut a new release',
              '',
              '### Scan Details',
              '',
              `- **Scan Date:** ${new Date().toISOString()}`,
              '- **Scan Type:** govulncheck (reachability-checked stdlib + dependencies)',
              '',
              'For detailed vulnerability information, check the workflow run:',
              runUrl,
              '',
              '---',
              '*This issue was automatically created by the security-scan workflow.*',
            ].join('\n');

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`📝 Updated existing security issue #${existingIssue.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: body,
                labels: ['security', 'automated', 'bug']
              });
              console.log(`📝 Created new security issue #${newIssue.data.number}`);
            }

      - name: Fail on reachable vulnerabilities
        if: >-
          steps.check_gomod.outputs.has_gomod == 'true' &&
          steps.govulncheck.outputs.exit_code == '3'
        run: |
          echo "::error::govulncheck found reachable vulnerabilities - see the govulncheck step above"
          exit 1

      - name: Skip govulncheck (no go.mod)
        if: steps.check_gomod.outputs.has_gomod == 'false'
        run: echo "ℹ️ No go.mod found, skipping govulncheck"

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    # A cold NVD cache (first run for a repo, or a fully-expired weekly cache) has to
    # pull the entire ~380k-CVE corpus instead of an incremental delta, which routinely
    # takes 20-30+ minutes even with an API key. 20 minutes was cutting it too close and
    # cancelling the job also throws away the partially-built cache, forcing a full
    # cold-start retry next time.
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write

    env:
      DEPENDENCY_CHECK_VERSION: "12.1.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}

      - name: Check for Java project
        id: check_java
        run: |
          if [[ -f pom.xml || -f build.gradle.kts || -f build.gradle ]]; then
            echo "has_java=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_java=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.check_java.outputs.has_java == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Dependency-Check CLI
        if: steps.check_java.outputs.has_java == 'true'
        id: cache-odc-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/dependency-check-bin
          key: dependency-check-cli-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Dependency-Check CLI
        if: >-
          steps.check_java.outputs.has_java == 'true' &&
          steps.cache-odc-cli.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-check-bin"
          gh release download "v${DEPENDENCY_CHECK_VERSION}" \
            --repo jeremylong/DependencyCheck \
            --pattern "dependency-check-${DEPENDENCY_CHECK_VERSION}-release.zip" \
            --output "$RUNNER_TEMP/dependency-check.zip"
          unzip -q "$RUNNER_TEMP/dependency-check.zip" -d "$RUNNER_TEMP/dependency-check-bin"
          chmod +x "$RUNNER_TEMP/dependency-check-bin/dependency-check/bin/dependency-check.sh"
        env:
          GH_TOKEN: ${{ github.token }}

      # The NVD vulnerability database isn't repo-specific, and these runners are
      # self-hosted on a persistent /srv volume, so the database lives in a fixed
      # host directory shared across every repo's dependency-check job instead of a
      # per-repo GitHub Actions cache. Only the very first scan on a given runner
      # ever pays for a full cold sync; every job after that (any repo) does a fast
      # incremental update, with no cache upload/download round-trip either.
      - name: Run OWASP Dependency-Check
        if: steps.check_java.outputs.has_java == 'true'
        id: dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_NIST_API_KEY }}
        run: |
          set -Eeuo pipefail
          exit_code=0
          mkdir -p dependency-check-report
          nvd_data_dir=/srv/github-runner/dependency-check-data
          # All dependency-check jobs on this runner execute as the same
          # github-runner service account, so a fixed mode is sufficient -
          # this isn't shared across different runner users.
          if ! mkdir -p "$nvd_data_dir" 2>/dev/null || [[ ! -w "$nvd_data_dir" || ! -x "$nvd_data_dir" ]]; then
            # /srv isn't available, writable, or searchable (GitHub-hosted
            # runner, or a self-hosted runner without that persistent
            # volume) - fall back to a per-job scratch dir. Every job then
            # pays for a full cold sync instead of sharing the persistent
            # NVD cache.
            printf '::notice::%s not writable - using RUNNER_TEMP instead\n' "$nvd_data_dir"
            nvd_data_dir="$RUNNER_TEMP/dependency-check-data"
            mkdir -p "$nvd_data_dir"
          fi
          chmod 750 "$nvd_data_dir"
          # The shared database is a single H2 file; serialize access so concurrent
          # jobs on this runner (different repos, same schedule) don't corrupt it.
          exec 200>"$nvd_data_dir/.lock"
          if ! flock -w 1800 200; then
            echo "::error::timed out after 30m waiting for the dependency-check NVD lock" \
              "(${nvd_data_dir}/.lock) - another job is likely still running a cold sync"
            exit 1
          fi
          "$RUNNER_TEMP/dependency-check-bin/dependency-check/bin/dependency-check.sh" \
            --project "${{ github.event.repository.name }}" \
            --scan . \
            --exclude "**/build/**" \
            --exclude "**/.gradle/**" \
            --format JSON \
            --out dependency-check-report \
            --data "$nvd_data_dir" \
            --nvdApiKey "$NVD_API_KEY" \
            --failOnCVSS 9 \
            --disableAssembly \
            --disableOssIndex \
            --disableKnownExploited \
            || exit_code=$?
          # OSS Index is disabled (no credentials configured, anonymous calls hit
          # Sonatype's rate limit and hard-fail the job) - NVD stays the
          # authoritative CVE source for the --failOnCVSS gate above. The CISA KEV
          # feed is disabled too: these runners get a consistent 403 from it, and
          # with no locally cached fallback that's a fatal error, not a warning.
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          # --failOnCVSS makes the tool exit 15 once a finding at/above the threshold
          # shows up (verified against dependency-check-cli 12.1.0's App.class), so
          # that code here means "vulnerabilities found", not "tool broke" - same
          # distinction govulncheck's exit code 3 makes above.
          if [[ "${exit_code}" != "0" && "${exit_code}" != "15" ]]; then
            echo "::error::dependency-check failed to run (exit code ${exit_code})"
            exit "${exit_code}"
          fi

      - name: Check for vulnerabilities and create issue
        if: steps.check_java.outputs.has_java == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            let report;
            try {
              const data = fs.readFileSync('dependency-check-report/dependency-check-report.json', 'utf8');
              report = JSON.parse(data);
            } catch (error) {
              console.log('No dependency-check report found or error reading it');
              return;
            }

            let criticalCount = 0;
            let highCount = 0;
            const rows = [];
            const seen = new Set();

            for (const dep of report.dependencies || []) {
              for (const vuln of dep.vulnerabilities || []) {
                if (seen.has(vuln.name)) continue;
                seen.add(vuln.name);
                if (vuln.severity === 'CRITICAL') criticalCount++;
                if (vuln.severity === 'HIGH') highCount++;
                if (vuln.severity === 'CRITICAL' || vuln.severity === 'HIGH') {
                  rows.push(`| \`${vuln.name}\` | ${vuln.severity} | \`${dep.fileName}\` |`);
                }
              }
            }

            if (criticalCount === 0 && highCount === 0) {
              console.log('✅ No critical or high vulnerabilities found by dependency-check!');
              return;
            }

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });

            const issueTitle = '🔒 Security vulnerabilities detected (dependency-check)';
            const existingIssue = issues.data.find(issue => issue.title === issueTitle);

            const repoBase = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoBase}/actions/runs/${context.runId}`;
            const body = [
              '## 🔒 Security Vulnerabilities Detected (OWASP Dependency-Check)',
              '',
              'Dependency-Check found vulnerabilities in the project\'s Java dependencies:',
              '',
              `- **Critical:** ${criticalCount}`,
              `- **High:** ${highCount}`,
              '',
              '| CVE | Severity | Dependency |',
              '| --- | -------- | ---------- |',
              ...rows,
              '',
              '### Action Required',
              '',
              '1. Review the vulnerabilities in the workflow logs (link below)',
              '2. Update affected dependencies',
              '3. Test the changes',
              '4. Create a PR with fixes',
              '',
              '### Scan Details',
              '',
              `- **Scan Date:** ${new Date().toISOString()}`,
              '- **Scan Type:** OWASP Dependency-Check',
              '',
              'For detailed vulnerability information, check the workflow run:',
              runUrl,
              '',
              '---',
              '*This issue was automatically created by the security-scan workflow.*',
            ].join('\n');

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`📝 Updated existing security issue #${existingIssue.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: body,
                labels: ['security', 'automated', 'bug']
              });
              console.log(`📝 Created new security issue #${newIssue.data.number}`);
            }

      - name: Fail on critical vulnerabilities
        if: >-
          steps.check_java.outputs.has_java == 'true' &&
          steps.dependency-check.outputs.exit_code == '15'
        run: |
          echo "::error::dependency-check found vulnerabilities at/above CVSS 9 - see the dependency-check step above"
          exit 1

      - name: Skip dependency-check (no Java project)
        if: steps.check_java.outputs.has_java == 'false'
        run: echo "ℹ️ No pom.xml or build.gradle(.kts) found, skipping dependency-check"
