---
name: Release Label

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]

# Deliberately its own workflow/concurrency group, separate from ci-cd.yml's
# heavier detect-changes/check-trigger/test chain — labeled/unlabeled here
# only ever reruns this one cheap check, not the whole PR validation chain.
# cancel-in-progress is off: this job is a few seconds, so letting a
# redundant run finish instead of cancelling it avoids ever leaving a
# CANCELLED check-run on the commit (which would fail the commit-level
# statusCheckRollup even with a SUCCESS run alongside it).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-label:
    name: Release Label Check
    uses: miikkak/workflows/.github/workflows/check-release-label.yml@e599eb3588fa60cd265bdb678509a3e61a7f3abe # main
    permissions:
      contents: read
      pull-requests: read
