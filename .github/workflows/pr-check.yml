---
name: PR Check

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      python-version:
        description: Python version for pre-commit
        type: string
        default: "3.14"
      install-hadolint:
        description: Install hadolint (needed for repos with Dockerfiles)
        type: boolean
        default: true
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  detect-runner:
    name: Detect Runner
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick runner
        id: pick
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          DEFAULT_RUNNER: ${{ inputs.runner || '["self-hosted","linux","generic"]' }}
        run: |
          set -Eeuo pipefail
          # Untrusted only when the base repo is genuinely public AND the PR
          # comes from an actual fork (not a branch pushed directly into this
          # repo by us, Renovate, or Dependabot) — route those to an
          # ephemeral GitHub-hosted runner so arbitrary PR-controlled code
          # never touches self-hosted infrastructure. Private repos can't
          # receive fork PRs from anyone not already invited, so this is a
          # no-op there; non-pull_request events (push, release, schedule)
          # are always trusted since only someone with write access triggers
          # them.
          untrusted_fork=false
          if [[ "${REPO_PRIVATE}" == "false" && "${EVENT_NAME}" == "pull_request" \
                && "${HEAD_REPO}" != "${BASE_REPO}" ]]; then
            untrusted_fork=true
          fi
          if [[ "${untrusted_fork}" == "true" ]]; then
            echo 'runner=["ubuntu-slim"]' >> "$GITHUB_OUTPUT"
          else
            echo "runner=${DEFAULT_RUNNER}" >> "$GITHUB_OUTPUT"
          fi

  pre-commit:
    name: pre-commit
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runner) }}
    timeout-minutes: 10
    env:
      SHELLCHECK_FALLBACK_VERSION: v0.11.0
      HADOLINT_FALLBACK_VERSION: v2.12.0
      PYTHON_VERSION: ${{ inputs.python-version || '3.14' }}
      INSTALL_HADOLINT: ${{ inputs.install-hadolint == false && 'false' || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute merge base
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-parse --verify HEAD~ 2>/dev/null || git rev-parse HEAD)"
            fi
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          echo "MERGE_BASE=${MERGE_BASE}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${HEAD}" >> "$GITHUB_ENV"

      - name: Compute tools cache key
        run: |
          hadolint_part=""
          [[ "${INSTALL_HADOLINT}" == "true" ]] && hadolint_part="-hadolint-${HADOLINT_FALLBACK_VERSION}"
          CACHE_KEY="tools-shellcheck-${SHELLCHECK_FALLBACK_VERSION}${hadolint_part}"
          echo "TOOLS_CACHE_KEY=${CACHE_KEY}-${{ runner.os }}-$(uname -m)" >> "$GITHUB_ENV"

      - name: Cache tool binaries
        id: cache-tools
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tools
          key: ${{ env.TOOLS_CACHE_KEY }}

      - name: Provision lint tools
        run: |
          set -Eeuo pipefail
          # Install lint binaries to ~/.local/bin and prepend it to PATH so they
          # shadow any same-named shims in /usr/local/bin (e.g. self-hosted runners
          # may carry podman-container wrappers for shellcheck/hadolint that must not
          # be used in CI).
          #
          # Prefer the system binary in /usr/bin (present on self-hosted Gentoo
          # runners, version managed by portage) to avoid a redundant network
          # download. Fall back to a versioned download (SHELLCHECK_FALLBACK_VERSION /
          # HADOLINT_FALLBACK_VERSION, cached in ~/.cache/tools) when the system
          # binary is absent, e.g. on github-hosted runners. The download guard is
          # the cached file existing — self-healing if the cache action reports a hit
          # but restores nothing.
          TOOLS_DIR="$HOME/.cache/tools"
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$TOOLS_DIR" "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$PATH"

          # Detect host architecture for downloading arch-native binaries
          HOST_ARCH="$(uname -m)"
          # Map uname -m to hadolint's arch naming (aarch64 → arm64, else passthrough)
          case "${HOST_ARCH}" in
            aarch64) HADOLINT_ARCH="arm64" ;;
            *)       HADOLINT_ARCH="${HOST_ARCH}" ;;
          esac

          # Self-hosted Gentoo runners have shellcheck/hadolint managed by portage;
          # use the system binary as-is without version-matching. SHELLCHECK_FALLBACK_VERSION
          # and HADOLINT_FALLBACK_VERSION are the pinned fallback versions for runners that
          # lack a system install (e.g. github-hosted). Deliberate trade-off: version
          # pinning on self-hosted is delegated to the OS package manager.
          if [[ -x /usr/bin/shellcheck ]]; then
            install -m 0755 /usr/bin/shellcheck "$BIN_DIR/shellcheck"
          else
            # Cache key includes arch so x86_64 and aarch64 runners don't share binaries
            SHELLCHECK_CACHE="$TOOLS_DIR/shellcheck-${SHELLCHECK_FALLBACK_VERSION}-${HOST_ARCH}"
            if [[ ! -x "${SHELLCHECK_CACHE}" ]]; then
              SHELLCHECK_ARCHIVE="shellcheck-${SHELLCHECK_FALLBACK_VERSION}.linux.${HOST_ARCH}.tar.xz"
              SHELLCHECK_BASE="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_FALLBACK_VERSION}"
              curl -fsSL --retry 3 --retry-delay 5 \
                "${SHELLCHECK_BASE}/${SHELLCHECK_ARCHIVE}" \
                -o "/tmp/${SHELLCHECK_ARCHIVE}"
              curl -fsSL --retry 3 --retry-delay 5 \
                "${SHELLCHECK_BASE}/${SHELLCHECK_ARCHIVE}.sha256" \
                -o "/tmp/${SHELLCHECK_ARCHIVE}.sha256"
              # sha256sum -c resolves filenames relative to cwd; the .sha256 file
              # contains the archive filename, so both must live in /tmp together.
              (cd /tmp && sha256sum -c "${SHELLCHECK_ARCHIVE}.sha256")
              tar -xJf "/tmp/${SHELLCHECK_ARCHIVE}" -C /tmp
              install -m 0755 "/tmp/shellcheck-${SHELLCHECK_FALLBACK_VERSION}/shellcheck" "${SHELLCHECK_CACHE}"
            fi
            install -m 0755 "${SHELLCHECK_CACHE}" "$BIN_DIR/shellcheck"
          fi
          shellcheck --version

          if [[ "${INSTALL_HADOLINT}" == "true" ]]; then
            if [[ -x /usr/bin/hadolint ]]; then
              install -m 0755 /usr/bin/hadolint "$BIN_DIR/hadolint"
            else
              # Cache key includes arch so x86_64 and aarch64 runners don't share binaries
              HADOLINT_CACHE="$TOOLS_DIR/hadolint-${HADOLINT_FALLBACK_VERSION}-${HOST_ARCH}"
              if [[ ! -x "${HADOLINT_CACHE}" ]]; then
                HADOLINT_BASE="https://github.com/hadolint/hadolint/releases/download/${HADOLINT_FALLBACK_VERSION}"
                HADOLINT_TMP="${TOOLS_DIR}/hadolint.tmp"
                curl -fsSL --retry 3 --retry-delay 5 \
                  "${HADOLINT_BASE}/hadolint-Linux-${HADOLINT_ARCH}" \
                  -o "${HADOLINT_TMP}"
                curl -fsSL --retry 3 --retry-delay 5 \
                  "${HADOLINT_BASE}/hadolint-Linux-${HADOLINT_ARCH}.sha256" \
                  -o "/tmp/hadolint-Linux-${HADOLINT_ARCH}.sha256"
                # Extract the hash and verify the temp file before promoting to cache
                HADOLINT_HASH="$(awk '{print $1}' "/tmp/hadolint-Linux-${HADOLINT_ARCH}.sha256")"
                echo "${HADOLINT_HASH}  ${HADOLINT_TMP}" | sha256sum -c
                install -m 0755 "${HADOLINT_TMP}" "${HADOLINT_CACHE}"
                rm -f "${HADOLINT_TMP}"
              fi
              install -m 0755 "${HADOLINT_CACHE}" "$BIN_DIR/hadolint"
            fi
            hadolint --version
          fi

      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Cache pre-commit environments
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install pre-commit
        if: runner.environment == 'github-hosted'
        run: python -m pip install pre-commit

      - name: Run pre-commit on changed files
        run: >-
          pre-commit run --show-diff-on-failure --color=always
          --from-ref ${{ env.MERGE_BASE }} --to-ref ${{ env.HEAD_SHA }}
        env:
          SKIP: no-commit-to-branch
