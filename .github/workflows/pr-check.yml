---
name: PR Check

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      python-version:
        description: Python version for pre-commit
        type: string
        default: "3.14"
      install-hadolint:
        description: Install hadolint (needed for repos with Dockerfiles)
        type: boolean
        default: true
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
      HADOLINT_VERSION: v2.12.0
      PYTHON_VERSION: ${{ inputs.python-version || '3.14' }}
      INSTALL_HADOLINT: ${{ inputs.install-hadolint == false && 'false' || 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute merge base
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-parse --verify HEAD~ 2>/dev/null || git rev-parse HEAD)"
            fi
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
          echo "MERGE_BASE=${MERGE_BASE}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${HEAD}" >> "$GITHUB_ENV"

      - name: Compute tools cache key
        run: |
          hadolint_part=""
          [[ "${INSTALL_HADOLINT}" == "true" ]] && hadolint_part="-hadolint-${HADOLINT_VERSION}"
          echo "TOOLS_CACHE_KEY=tools-shellcheck-${SHELLCHECK_VERSION}${hadolint_part}-${{ runner.os }}" \
            >> "$GITHUB_ENV"

      - name: Cache tool binaries
        id: cache-tools
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/tools
          key: ${{ env.TOOLS_CACHE_KEY }}

      - name: Provision lint tools
        run: |
          set -Eeuo pipefail
          # Install real, version-pinned binaries to ~/.local/bin and prepend it
          # to PATH. ~/.local/bin therefore shadows any same-named shims in
          # /usr/local/bin (e.g. self-hosted runners may carry podman-container
          # wrappers for shellcheck/hadolint that must not be used in CI).
          #
          # Prefer the real system binary in /usr/bin when it already matches the
          # pinned version — self-hosted Gentoo runners ship the exact pinned
          # binaries, so copying them locally avoids a redundant network
          # download. Fall back to a pinned download (cached in ~/.cache/tools)
          # when the system binary is absent or version-mismatched, e.g. on
          # github-hosted runners. The download guard is the cached file existing
          # — self-healing if the cache action reports a hit but restores nothing.
          TOOLS_DIR="$HOME/.cache/tools"
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$TOOLS_DIR" "$BIN_DIR"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$BIN_DIR:$PATH"

          SHELLCHECK_BARE="${SHELLCHECK_VERSION#v}"
          if [[ -x /usr/bin/shellcheck ]] \
            && /usr/bin/shellcheck --version 2>/dev/null | grep -qwF "$SHELLCHECK_BARE"; then
            install -m 0755 /usr/bin/shellcheck "$BIN_DIR/shellcheck"
          else
            if [[ ! -x "$TOOLS_DIR/shellcheck" ]]; then
              SHELLCHECK_ARCHIVE="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
              curl -fsSL --retry 3 --retry-delay 5 \
                "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${SHELLCHECK_ARCHIVE}" \
                -o "/tmp/${SHELLCHECK_ARCHIVE}"
              echo "${SHELLCHECK_SHA256}  /tmp/${SHELLCHECK_ARCHIVE}" | sha256sum -c -
              tar -xJf "/tmp/${SHELLCHECK_ARCHIVE}" -C /tmp
              install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$TOOLS_DIR/shellcheck"
            fi
            install -m 0755 "$TOOLS_DIR/shellcheck" "$BIN_DIR/shellcheck"
          fi
          shellcheck --version

          if [[ "${INSTALL_HADOLINT}" == "true" ]]; then
            HADOLINT_BARE="${HADOLINT_VERSION#v}"
            if [[ -x /usr/bin/hadolint ]] \
              && /usr/bin/hadolint --version 2>/dev/null | grep -qwF "$HADOLINT_BARE"; then
              install -m 0755 /usr/bin/hadolint "$BIN_DIR/hadolint"
            else
              if [[ ! -x "$TOOLS_DIR/hadolint" ]]; then
                HADOLINT_BASE="https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}"
                curl -fsSL --retry 3 --retry-delay 5 \
                  "${HADOLINT_BASE}/hadolint-Linux-x86_64" \
                  -o "$TOOLS_DIR/hadolint-Linux-x86_64"
                curl -fsSL --retry 3 --retry-delay 5 \
                  "${HADOLINT_BASE}/hadolint-Linux-x86_64.sha256" \
                  -o /tmp/hadolint-Linux-x86_64.sha256
                (cd "$TOOLS_DIR" && sha256sum -c /tmp/hadolint-Linux-x86_64.sha256)
                mv "$TOOLS_DIR/hadolint-Linux-x86_64" "$TOOLS_DIR/hadolint"
                chmod +x "$TOOLS_DIR/hadolint"
              fi
              install -m 0755 "$TOOLS_DIR/hadolint" "$BIN_DIR/hadolint"
            fi
            hadolint --version
          fi

      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v6
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Cache pre-commit environments
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install pre-commit
        if: runner.environment == 'github-hosted'
        run: python -m pip install pre-commit

      - name: Run pre-commit on changed files
        run: >-
          pre-commit run --show-diff-on-failure --color=always
          --from-ref ${{ env.MERGE_BASE }} --to-ref ${{ env.HEAD_SHA }}
        env:
          SKIP: no-commit-to-branch
