---
name: Release (self)

# Equivalent of every consumer repo's own release.yml. release-deploy.yml
# (webhook delivery to DEPLOY_SERVERS) is deliberately not called here —
# this repo has nothing to deploy, it ships tarballs of the workflow files
# themselves for reference/pinning purposes.

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.2.3)"
        required: true
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'workflow_dispatch' && inputs.tag || github.ref
    }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-build:
    # Fully-qualified, not relative: release-tarball.yml itself relatively
    # calls validate-tag.yml (uses: ./...), and chaining two relative
    # reusable-workflow references back to back — even within the same
    # repo, even from a branch ref — hits a startup_failure with 0 jobs
    # created (confirmed by testing both the v1.0.0 tag-push trigger and a
    # workflow_dispatch from main; both failed identically). One level of
    # self-relative reference works fine (see self-cd.yml -> cd.yml, which
    # doesn't itself nest a further relative call); two chained does not.
    # Every consumer repo's release.yml already calls release-tarball.yml
    # fully-qualified for unrelated reasons (cross-repo) and its internal
    # relative call to validate-tag.yml works fine from that position —
    # matching that proven-working shape here instead of inventing a new one.
    uses: miikkak/workflows/.github/workflows/release-tarball.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
