---
name: Check Release Label

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'

permissions:
  contents: read
  pull-requests: read

# ==============================================================================
# SHARED WORKFLOW - check-release-label.yml
# ==============================================================================
# Validates that PRs with deployment-affecting changes carry a release: label.
# Configuration is read from .github/label-check.yml in the calling repository.
#
# Config format (.github/label-check.yml):
#   required: true          # Whether this repo requires a release: label at all
#   exempt_patterns:        # Files matching these patterns do NOT require the label
#     - "**/*.md"           # Docs-only changes are typically exempt
#     - "docs/**"
#     - ".github/ISSUE_TEMPLATE/**"
#
# Supported glob syntax in patterns:
#   *     matches any character except /
#   **    matches any character including / (recursive)
#   ?     matches a single character except /
#
# Valid release labels (all satisfy the check):
#   release:major   — backwards-incompatible change
#   release:minor   — new backwards-compatible feature
#   release:patch   — bug fix
#   release:none    — intentional skip of deployment (no release created)
#
# The release:none label is for emergency bypasses or PRs that change code
# without triggering a new deployment. Deployment workflows should check for
# this label and skip when present.
# ==============================================================================

jobs:
  check:
    name: Release Label Check
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify release label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import fnmatch
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          CONFIG_PATH = '.github/label-check.yml'
          RELEASE_LABELS = {'release:major', 'release:minor', 'release:patch', 'release:none'}


          def parse_config(text):
              """Parse the subset of YAML used in label-check.yml without external deps."""
              result = {}
              current_list_key = None
              for line in text.splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith('#'):
                      continue
                  if line.startswith('  - '):
                      if current_list_key is not None:
                          result.setdefault(current_list_key, []).append(
                              stripped[2:].strip().strip('\'"')
                          )
                  elif ': ' in stripped or stripped.endswith(':'):
                      current_list_key = None
                      if ': ' in stripped:
                          key, _, val = stripped.partition(': ')
                          val = val.strip().strip('\'"')
                          if val.lower() in ('true', 'yes'):
                              result[key.strip()] = True
                          elif val.lower() in ('false', 'no'):
                              result[key.strip()] = False
                          else:
                              result[key.strip()] = val
                      else:
                          current_list_key = stripped.rstrip(':').strip()
              return result


          def matches_pattern(filename, pattern):
              """Match filename against a glob pattern with ** support."""
              filename = filename.replace('\\', '/')
              pattern = pattern.replace('\\', '/')

              if pattern == '**':
                  return True

              if '**' not in pattern:
                  if '/' not in pattern:
                      return fnmatch.fnmatch(os.path.basename(filename), pattern)
                  return fnmatch.fnmatch(filename, pattern)

              # Convert ** glob to regex
              parts = []
              i = 0
              while i < len(pattern):
                  if pattern[i:i+3] == '**/':
                      parts.append('(.+/)?')
                      i += 3
                  elif pattern[i:i+2] == '**':
                      parts.append('.*')
                      i += 2
                  elif pattern[i] == '*':
                      parts.append('[^/]*')
                      i += 1
                  elif pattern[i] == '?':
                      parts.append('[^/]')
                      i += 1
                  else:
                      parts.append(re.escape(pattern[i]))
                      i += 1

              return bool(re.match('^' + ''.join(parts) + '$', filename))


          def matches_any(filename, patterns):
              return any(matches_pattern(filename, p) for p in patterns)


          def gh_api(path, extra_args=None):
              cmd = ['gh', 'api', path]
              if extra_args:
                  cmd.extend(extra_args)
              result = subprocess.run(cmd, capture_output=True, text=True, check=True)
              return result.stdout


          # --- Load config ---
          if not os.path.exists(CONFIG_PATH):
              print(f'ℹ️  No {CONFIG_PATH} found — skipping release label check')
              sys.exit(0)

          with open(CONFIG_PATH) as f:
              config = parse_config(f.read())

          if not config.get('required', False):
              print('ℹ️  Release label not required for this repository')
              sys.exit(0)

          repo = os.environ['REPO']
          pr_number = os.environ['PR_NUMBER']

          if not pr_number:
              print('ℹ️  No pull request number found — skipping (not a PR context)')
              sys.exit(0)

          # --- Get PR labels ---
          def fetch_labels():
              pr_json = gh_api(f'repos/{repo}/pulls/{pr_number}', ['--jq', '[.labels[].name]'])
              return set(json.loads(pr_json))

          labels = fetch_labels()
          release_labels_present = labels & RELEASE_LABELS

          # --- Get changed files ---
          files_out = gh_api(
              f'repos/{repo}/pulls/{pr_number}/files',
              ['--paginate', '--jq', '.[].filename'],
          )
          files = [f for f in files_out.splitlines() if f]

          exempt_patterns = config.get('exempt_patterns', [])

          # Files that are NOT exempt from the release label requirement
          deployment_files = [f for f in files if not matches_any(f, exempt_patterns)]

          print(f'📋 Changed files: {len(files)} total, {len(deployment_files)} deployment-affecting')
          print(f'🏷️  Labels on PR: {sorted(labels) or "(none)"}')

          if not deployment_files:
              print('✅ All changed files are exempt (docs/config only) — no release label required')
              sys.exit(0)

          print(f'📦 Deployment-affecting files:')
          for f in deployment_files:
              print(f'   • {f}')

          if release_labels_present:
              print(f'✅ Release label present: {sorted(release_labels_present)}')
              sys.exit(0)

          # No label yet — a sibling workflow triggered by the same event (e.g. an
          # automerge workflow labeling a bot PR) may still be landing it. Labels
          # added with GITHUB_TOKEN don't trigger a fresh run of this check, so
          # without a short poll here that race would fail the check permanently.
          RETRY_ATTEMPTS = 6
          RETRY_DELAY_SECONDS = 5
          for attempt in range(1, RETRY_ATTEMPTS + 1):
              print(f'⏳ No release label yet, retrying ({attempt}/{RETRY_ATTEMPTS})...')
              time.sleep(RETRY_DELAY_SECONDS)
              labels = fetch_labels()
              release_labels_present = labels & RELEASE_LABELS
              if release_labels_present:
                  print(f'✅ Release label present: {sorted(release_labels_present)}')
                  sys.exit(0)

          print()
          print('❌ Deployment-affecting files changed but no release: label found on this PR.')
          print('   Add one of the following labels before merging:')
          print('     release:major  — backwards-incompatible change')
          print('     release:minor  — new backwards-compatible feature')
          print('     release:patch  — bug fix or dependency update')
          print('     release:none   — intentional skip of deployment')
          print()
          print('   If you only changed documentation or other exempt files, check')
          print(f'   the exempt_patterns in {CONFIG_PATH}.')
          sys.exit(1)
          PYEOF
