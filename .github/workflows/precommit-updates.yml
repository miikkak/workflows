---
name: Pre-commit Hook Updates

on: # yamllint disable-line rule:truthy
  schedule:
    # Run every Monday at 09:30 UTC
    - cron: "30 9 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","generic"]')
        type: string
        default: '["self-hosted","linux","generic"]'
      python-version:
        description: Python version for pre-commit
        type: string
        default: "3.14"
      install-hadolint:
        description: Install hadolint before running pre-commit (needed for repos with Dockerfiles)
        type: boolean
        default: false
      default-branch:
        description: Branch to base the update PR on
        type: string
        default: main
      autoupdate-exclude-repos:
        description: >-
          Whitespace/comma-separated repo URL suffixes that `pre-commit autoupdate` must
          never bump. Defaults to scop/pre-commit-shfmt, whose pin must match the shfmt
          bundled in the Super-Linter image (enforced by super-linter.yml).
        type: string
        default: scop/pre-commit-shfmt

concurrency:
  group: precommit-updates
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  check-updates:
    name: Check Pre-commit Hook Updates
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","generic"]') }}
    timeout-minutes: 10
    env:
      HADOLINT_VERSION: v2.12.0
      PYTHON_VERSION: ${{ inputs.python-version || '3.14' }}
      INSTALL_HADOLINT: ${{ inputs.install-hadolint == true && 'true' || 'false' }}
      EXCLUDE_REPOS: ${{ inputs.autoupdate-exclude-repos || 'scop/pre-commit-shfmt' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}

      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Cache pre-commit environments
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install hadolint
        if: env.INSTALL_HADOLINT == 'true' && runner.environment == 'github-hosted'
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /tmp/hadolint-Linux-x86_64
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64.sha256" \
            -o /tmp/hadolint-Linux-x86_64.sha256
          (cd /tmp && sha256sum -c hadolint-Linux-x86_64.sha256)
          sudo install -m 0755 /tmp/hadolint-Linux-x86_64 /usr/local/bin/hadolint
          hadolint --version

      - name: Install pre-commit
        if: runner.environment == 'github-hosted'
        run: |
          pip install pre-commit
          pre-commit --version

      - name: Check for hook updates
        id: check
        run: |
          echo "Checking for pre-commit hook updates..."

          # Build --repo args from every remote repo in the config except the
          # excluded ones (e.g. scop/pre-commit-shfmt, which is pinned to the
          # shfmt bundled in the Super-Linter image, not "latest").
          repo_args=()
          normalize() {
            local u="${1%/}"
            printf '%s' "${u%.git}"
          }
          IFS=$' \t\n,' read -r -d '' -a excludes < <(printf '%s' "$EXCLUDE_REPOS") || true
          while read -r url; do
            [[ "$url" == local || "$url" == meta ]] && continue
            norm="$(normalize "$url")"
            skip=false
            for ex in "${excludes[@]}"; do
              ex="$(normalize "$ex")"
              if [[ "$norm" == "$ex" || "$norm" == */"$ex" || "$norm" == *:"$ex" ]]; then
                skip=true
                echo "Skipping excluded repo: $url"
              fi
            done
            [[ "$skip" == true ]] || repo_args+=(--repo "$url")
          done < <(
            sed -nE "s/^[[:space:]]*-?[[:space:]]*repo:[[:space:]]*[\"']?([^\"'[:space:]]+).*/\\1/p" \
              .pre-commit-config.yaml | sort -u
          )

          if ((${#repo_args[@]} == 0)); then
            echo "No updatable repos found" > update-output.txt
          else
            pre-commit autoupdate "${repo_args[@]}" > update-output.txt 2>&1 || true
          fi

          if grep -qi "updating" update-output.txt; then
            echo "updates_available=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Pre-commit hook updates available"
          else
            echo "updates_available=false" >> "$GITHUB_OUTPUT"
            echo "✅ All pre-commit hooks are up to date"
          fi

          cat update-output.txt
          echo "---" >> update-output.txt

      - name: Create PR with updates
        if: steps.check.outputs.updates_available == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch || 'main' }}
        with:
          github-token: ${{ secrets.PULL_REQUEST_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const defaultBranch = process.env.DEFAULT_BRANCH;

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:auto-update/update-pre-commit-hooks`
            });

            if (prs.data.length > 0) {
              console.log(`PR already exists: #${prs.data[0].number}`);
              return;
            }

            const branchName = 'auto-update/update-pre-commit-hooks';

            try {
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${defaultBranch}`
              });

              // Delete the branch if it already exists (e.g. from a previous failed run)
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branchName}`
                });
                console.log(`🗑️ Deleted stale branch: ${branchName}`);
              } catch (deleteError) {
                if (deleteError.status !== 422) throw deleteError;
                // 422 = branch doesn't exist, which is fine
              }

              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: ref.object.sha
              });

              console.log(`✅ Created branch: ${branchName}`);

              const updatedConfig = fs.readFileSync('.pre-commit-config.yaml', 'utf8');

              const { data: currentFile } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.pre-commit-config.yaml',
                ref: branchName
              });

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.pre-commit-config.yaml',
                message: 'chore: update pre-commit hook versions',
                content: Buffer.from(updatedConfig).toString('base64'),
                sha: currentFile.sha,
                branch: branchName
              });

              console.log('✅ Updated .pre-commit-config.yaml');

              const updateOutput = fs.readFileSync('update-output.txt', 'utf8');

              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'chore: update pre-commit hook versions',
                head: branchName,
                base: defaultBranch,
                body: [
                  '## Update Pre-commit Hooks',
                  '',
                  'This PR updates the pre-commit hook versions to their latest releases.',
                  '',
                  '### Changes',
                  '',
                  '```',
                  updateOutput,
                  '```',
                  '',
                  '### Testing',
                  '',
                  'The pre-commit hooks will be automatically tested when this PR is created. To test locally:',
                  '',
                  '```bash',
                  'pre-commit run --all-files',
                  '```',
                  '',
                  '---',
                  '*This PR was automatically created by the pre-commit-updates workflow.*',
                ].join('\n')
              });

              console.log(`✅ Created PR #${pr.number}`);

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['dependencies', 'automated', 'release:none']
              });

              console.log('✅ Added labels to PR');

              try {
                await github.graphql(`
                  mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) {
                      pullRequest {
                        autoMergeRequest {
                          enabledAt
                        }
                      }
                    }
                  }
                `, { pullRequestId: pr.node_id });

                console.log('✅ Enabled automerge on PR');
              } catch (autoMergeError) {
                console.warn('⚠️ Could not enable automerge:', autoMergeError.message);
              }

            } catch (error) {
              console.error('Error creating PR:', error);

              const updateOutput = fs.readFileSync('update-output.txt', 'utf8');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⬆️ Pre-commit hook updates available',
                body: [
                  '## Pre-commit Hook Updates Available',
                  '',
                  'Updates are available for pre-commit hooks, but automatic PR creation failed.',
                  '',
                  '### Updates Available',
                  '',
                  '```',
                  updateOutput,
                  '```',
                  '',
                  '### Manual Update Instructions',
                  '',
                  '1. Update hooks locally:',
                  '   ```bash',
                  '   pre-commit autoupdate',
                  '   ```',
                  '',
                  `   Then restore the pinned \`rev\` of the excluded repos (\`${process.env.EXCLUDE_REPOS}\`):`,
                  '   they are managed separately (the shfmt pin must match the Super-Linter image)',
                  '   and must not be bumped by autoupdate.',
                  '',
                  '2. Test the updates:',
                  '   ```bash',
                  '   pre-commit run --all-files',
                  '   ```',
                  '',
                  '3. Commit and push:',
                  '   ```bash',
                  '   git checkout -b auto-update/update-pre-commit-hooks',
                  '   git add .pre-commit-config.yaml',
                  '   git commit -m "chore: update pre-commit hook versions"',
                  '   git push origin auto-update/update-pre-commit-hooks',
                  '   ```',
                  '',
                  '4. Create a PR and add the `release:none` label (pre-commit',
                  '   hook bumps are dev-tooling only and never touch',
                  '   release-relevant files; if a specific update does need',
                  '   a release, relabel that PR manually).',
                  '',
                  '---',
                  '*This issue was automatically created by the pre-commit-updates workflow.*',
                  `*Error: ${error.message}*`,
                ].join('\n'),
                labels: ['dependencies', 'automated', 'enhancement']
              });
            }
