---
name: Post-Merge Pipeline (self)

# This repo defines cd.yml as a reusable workflow_call for consumer repos —
# it can't also own the `push: main` trigger without a naming clash. This
# wrapper is the equivalent of every consumer repo's own cd.yml, calling the
# shared definition via a relative path (valid here: this file and cd.yml
# live in the same repo, unlike ci-cd.yml's verify-* jobs, which call out to
# a different top-level caller's repo — see the comments there).

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cd:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/cd.yml
    secrets:
      SEMANTIC_RELEASE_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
