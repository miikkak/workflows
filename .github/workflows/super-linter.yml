---
name: Lint

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      validate-bash:
        description: Enable BASH and SHELL_SHFMT validators
        type: boolean
        default: true
      validate-yaml:
        description: Enable YAML validator
        type: boolean
        default: true
      validate-markdown:
        description: Enable Markdown validator
        type: boolean
        default: true
      validate-github-actions:
        description: Enable GitHub Actions validator
        type: boolean
        default: true
      validate-json:
        description: Enable JSON validator
        type: boolean
        default: false
      check-shfmt-pin:
        description: >-
          Fail when the scop/pre-commit-shfmt pin in .pre-commit-config.yaml differs from
          the shfmt bundled in the Super-Linter image (no-op if the hook is absent)
        type: boolean
        default: true
      runner:
        description: Runner labels as a JSON array string (e.g. '["self-hosted","linux","x64","generic"]')
        type: string
        default: '["self-hosted","linux","x64","generic"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  super-lint:
    name: Super-Linter
    runs-on: ${{ fromJson(inputs.runner || '["self-hosted","linux","x64","generic"]') }}
    timeout-minutes: 10
    env:
      SUPERLINTER_IMAGE: ghcr.io/super-linter/super-linter:v8.7.0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure validators
        run: |
          set -Eeuo pipefail
          # Only write VALIDATE_*=true — never false.
          # Super-linter v8+ rejects mixing include (true) and exclude (false) modes.
          # Unmentioned validators simply don't run when any VALIDATE_* is set to true.
          #
          # shfmt formatting is controlled entirely by each repo's own
          # .editorconfig (super-linter v8.7.0's SHFMT_OPTIONS is a hardcoded
          # --apply-ignore, not a configurable passthrough - there is no
          # SHELL_SHFMT_OPTS env var it reads, confirmed by inspecting
          # /action/lib/globals/linterCommandsOptions.sh in the image).
          # Files that don't match a .editorconfig glob for indent_style/size
          # fall back to shfmt's own default (tabs) regardless of what's set
          # here - add a matching override in the consumer's .editorconfig,
          # not an option to this workflow.
          {
            if [[ '${{ inputs.validate-bash }}' != 'false' ]]; then
              printf 'VALIDATE_BASH=true\nVALIDATE_SHELL_SHFMT=true\nBASH_EXEC_IGNORE_LIBRARIES=true\n'
            fi
            if [[ '${{ inputs.validate-yaml }}' != 'false' ]]; then
              echo 'VALIDATE_YAML=true'
            fi
            if [[ '${{ inputs.validate-markdown }}' != 'false' ]]; then
              echo 'VALIDATE_MARKDOWN=true'
            fi
            if [[ '${{ inputs.validate-github-actions }}' != 'false' ]]; then
              echo 'VALIDATE_GITHUB_ACTIONS=true'
            fi
            if [[ '${{ inputs.validate-json }}' == 'true' ]]; then
              echo 'VALIDATE_JSON=true'
            fi
          } >> "$GITHUB_ENV"

      # The Super-Linter image is the single source of truth for the shfmt
      # version. pre-commit and CI must format identically, otherwise
      # pre-commit "fixes" files into a style this job rejects (and `Lint`
      # only runs post-merge, so main goes red). `pre-commit autoupdate` is
      # told to skip scop/pre-commit-shfmt (see precommit-updates.yml);
      # this check catches every other kind of drift.
      - name: Check pre-commit shfmt pin matches Super-Linter
        # toJSON: absent inputs (push/workflow_dispatch) are null, and
        # `null != false` is false in Actions expressions.
        if: toJSON(inputs.check-shfmt-pin) != 'false' && toJSON(inputs.validate-bash) != 'false'
        run: |
          set -Eeuo pipefail
          config=.pre-commit-config.yaml
          if [[ ! -f "$config" ]]; then
            echo "No $config - skipping shfmt pin check"
            exit 0
          fi
          if ! grep -qE 'repo:.*scop/pre-commit-shfmt' "$config"; then
            echo "scop/pre-commit-shfmt not used - skipping shfmt pin check"
            exit 0
          fi
          # rev of every scop/pre-commit-shfmt entry, wherever it sits in its block
          mapfile -t revs < <(awk '
            /^[[:space:]]*-?[[:space:]]*repo:/ { in_hook = ($0 ~ /scop\/pre-commit-shfmt/); next }
            in_hook && /^[[:space:]]*rev:/ {
              v = $0
              sub(/^[[:space:]]*rev:[[:space:]]*/, "", v)
              sub(/[[:space:]]*#.*$/, "", v)
              gsub(/["\047]/, "", v)
              print v
              in_hook = 0
            }
          ' "$config")
          entries="$(grep -cE 'repo:.*scop/pre-commit-shfmt' "$config")"
          if ((${#revs[@]} == 0 || ${#revs[@]} != entries)); then
            echo "::error file=${config}::Could not read the rev of every scop/pre-commit-shfmt entry"
            exit 1
          fi
          bundled="$(podman run --rm --network=none --entrypoint shfmt \
            "$SUPERLINTER_IMAGE" --version)"
          bundled="${bundled#v}"
          if [[ -z "$bundled" ]]; then
            echo "::error::Could not read shfmt version from ${SUPERLINTER_IMAGE}"
            exit 1
          fi
          for rev in "${revs[@]}"; do
            pinned="${rev#v}"
            pinned="${pinned%-*}"
            echo "pre-commit shfmt: ${pinned} (rev ${rev}); Super-Linter shfmt: ${bundled}"
            if [[ "$pinned" != "$bundled" ]]; then
              msg="shfmt drift: pre-commit pins ${pinned} but ${SUPERLINTER_IMAGE} bundles ${bundled}."
              msg+=" Set scop/pre-commit-shfmt rev to v${bundled}-<n> (latest -<n> tag for that version)."
              echo "::error file=${config}::${msg}"
              exit 1
            fi
          done

      - name: Super-Linter
        run: |
          set -Eeuo pipefail
          # Run super-linter directly via podman instead of the Docker action.
          # The GitHub runner's container-action path hardcodes a
          # -v /var/run/docker.sock mount that rootless podman cannot satisfy,
          # so we invoke the image ourselves in RUN_LOCAL mode (no daemon, no
          # socket, no GitHub API status reporting — the step exit code gates).
          # Only forward VALIDATE_* vars that the configure step actually set;
          # super-linter v8 rejects mixing include (true) and exclude (false).
          podman_env=()
          for v in VALIDATE_BASH VALIDATE_SHELL_SHFMT BASH_EXEC_IGNORE_LIBRARIES \
                   VALIDATE_YAML VALIDATE_MARKDOWN VALIDATE_GITHUB_ACTIONS \
                   VALIDATE_JSON; do
            [[ -n "${!v:-}" ]] && podman_env+=(-e "${v}=${!v}")
          done
          podman run --rm \
            --network=none \
            -e RUN_LOCAL=true \
            -e DEFAULT_WORKSPACE=/tmp/lint \
            -e LINTER_RULES_PATH=.github \
            -e DEFAULT_BRANCH=main \
            -e YAML_LINTER_RULES=.yamllint \
            -e MARKDOWN_LINTER_RULES=.markdownlint.json \
            "${podman_env[@]}" \
            -v "${GITHUB_WORKSPACE}:/tmp/lint:ro" \
            "${SUPERLINTER_IMAGE}"
